<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

const call = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));

const SDECK = location.pathname.indexOf('/dev/out/') >= 0 ? new URL('../../academy/', location.href).href : location.origin + '/ops/academy/';

const sWork = () => { const L = []; let d = SD.today; for (let k = 0; k < 14 && L.length < 5; k++) { if (spd(d).getDay() <= 4 && d >= SD.rot.start) L.push(d); d = sadd(d, -1); } return L.reverse(); };

const sToday1 = () => SD.syl.filter(x => x.date === SD.today);

  const r = SREP && SREP.day === day ? SREP : SD.mine.rep[day] || { st: '', act: [], learn: '', why: '' };
  return `<div class="seg" role="group" aria-label="האם היית">${[['v', 'הייתי'], ['p', 'חלקית'], ['x', 'לא הייתי']].map(([k, l]) => `<button data-rst="${k}" class="${r.st === k ? 'on' : ''}">${l}</button>`).join('')}</div>${r.st && r.st !== 'v' ? `<label class="f">סיבה</label><input class="in" id="rWhy" maxlength="120" value="${esc(r.why || '')}">` : ''}${r.st && r.st !== 'x' ? `<label class="f">מה עשיתי היום</label><div class="chk">${SD.acts.map(a => `<label><input type="checkbox" data-ract="${esc(a)}"${(r.act || []).indexOf(a) >= 0 ? ' checked' : ''}> ${esc(a)}</label>`).join('')}</div><label class="f">מה למדתי (שורה אחת)</label><input class="in" id="rLearn" maxlength="160" value="${esc(r.learn || '')}" placeholder="למשל: איך בודקים בטן בצורה מסודרת">` : ''}<button class="btn pri blk" id="rSave" data-rd="${day}">${SD.mine.rep[day] ? 'עדכון הדיווח' : 'שליחת הדיווח'}</button>`;
}

  const d = SD, hr = new Date().getHours(), hi = hr < 12 ? 'בוקר טוב' : hr < 18 ? 'צהריים טובים' : 'ערב טוב', td = sToday1(), wd = spd(d.today).getDay() <= 4, done = d.mine.rep[d.today];
  const fixed = wd ? [['07:30', 'ישיבת בוקר', 'חדר הישיבות של המערך'], ['08:15', 'ביקור, חדר ניתוח או מרפאה', 'לפי השיבוץ של הקבוצה']] : [];
  const eve = d.shifts.find(s => s.d === d.today), nm = new Date().toTimeString().slice(0, 5);
  const rows = fixed.map(f => ({ h: f[0], t: f[1], s: f[2] })).concat(td.map(x => ({ h: x.from, t: x.t, s: (x.lname || 'המלמד/ת יעודכנו בהמשך') + ' · ' + (d.kinds[x.kind] || ''), x }))).concat(eve ? [{ h: d.shcfg.from || '16:00', t: '🌙 משמרת ערב במיון', s: eve.res ? 'עם ' + eve.res : '' }] : []);
  return `<section class="hero"><img src="${SART}cavity.webp" alt="" onerror="this.remove()"><small>שבוע ${Math.max(1, d.rot.week)} מתוך ${d.rot.weeks}</small><h1>${hi}, ${esc(d.me.first)}</h1><p>${SDS[spd(d.today).getDay()]} ${sdm(d.today)} · ${esc(d.me.gname)}</p><div class="wkbar">${Array.from({ length: d.rot.weeks }, (_, i) => `<i class="${i + 1 < d.rot.week ? 'on' : i + 1 === d.rot.week ? 'now' : ''}"></i>`).join('')}</div></section>`
    + `<section class="card"><h2>🗓️ היום<span class="sp"></span><small>${d.att[d.today] === 'v' ? '✓ נוכחות נרשמה' : ''}</small></h2>${rows.length ? rows.map(r => `<div class="row${r.x && r.h <= nm && (r.x.to || '') > nm ? ' now' : ''}"><span class="h">${r.h}</span><span class="t"><b>${esc(r.t)}</b><small>${esc(r.s)}</small></span>${r.x && r.x.deck ? `<button class="btn sm" data-deck="${r.x.id}">▶ מצגת</button>` : ''}</div>`).join('') : '<p class="sub" style="margin:0">היום אין סבב. סוף שבוע נעים</p>'}</section>`
    + (wd && d.today >= d.rot.start ? `<section class="card"><h2>📝 הדיווח היומי<span class="sp"></span><small>${done ? '✓ נשלח' : 'עד סוף היום'}</small></h2><p class="sub">שתי דקות, בלי דירוגים ובלי פרטי מטופלים</p>${sRepForm(d.today)}</section>` : '')
    + (d.files.length ? `<section class="card"><h2>📎 נספחים וקבצים</h2>${d.files.map(f => `<div class="row"><span class="t"><b>${esc(f.t)}</b><small>${f.sec === 'intro' ? 'פתיחת הסבב' : 'לקריאה'}</small></span>${f.deck ? `<button class="btn sm" data-fdeck="${f.id}">פתיחה</button>` : '<span class="tag">בקרוב</span>'}</div>`).join('')}</section>` : '')
    + (d.contact ? `<section class="card"><h2>☎️ אחראי הסטודנטים</h2><p class="sub" style="margin:0">${esc(d.contact)}</p></section>` : '');
}
function sSched() {
  const d = SD, w = SWK, days = [0, 1, 2, 3, 4].map(i => sadd(d.rot.start, (w - 1) * 7 + i));
  return `<section class="card"><h2>🗓️ הלו״ז של הסבב</h2><div class="wks">${Array.from({ length: d.rot.weeks }, (_, i) => `<button data-wk="${i + 1}" class="${i + 1 === w ? 'on' : ''}${i + 1 === d.rot.week ? ' now' : ''}">שבוע ${i + 1}</button>`).join('')}</div>${days.map((dd, i) => { const L = d.syl.filter(x => x.date === dd); return `<div class="row"><span class="h">${SDS[i]}<small>${sdm(dd)}</small></span><span class="t">${L.map(x => `<b>${esc(x.t)}</b><small>${x.from} · ${esc(x.lname || 'המלמד/ת יעודכנו בהמשך')} · ${esc(d.kinds[x.kind] || '')}</small>${dd < d.today && x.kind !== 'exam' ? `<div class="stars" aria-label="דירוג המפגש">${[1, 2, 3, 4, 5].map(n => `<button data-rate="${x.id}|${n}" class="${(d.mine.rate[x.id] || 0) >= n ? 'on' : ''}" aria-label="${n}">★</button>`).join('')}</div>` : ''}`).join('') || '<small>ביקור, חדר ניתוח ומרפאות</small>'}</span>${L.filter(x => x.deck).map(x => `<button class="btn sm" data-deck="${x.id}">▶</button>`).join('')}</div>`; }).join('')}</section><p class="sub">⭐ אחרי שמפגש היה אפשר לדרג אותו. הדירוג אנונימי למרצה</p>`;
}
function sRep() {
  const d = SD, L = sWork(), day = SRD && L.indexOf(SRD) >= 0 ? SRD : L[L.length - 1], ic = { v: '✓', p: '½', x: '✗' }, all = Object.keys(d.mine.rep).length;
  return `<section class="card"><h2>📝 הדיווחים שלי<span class="sp"></span><small>${all} ימים</small></h2><p class="sub">חמשת ימי העבודה האחרונים. אפשר להשלים עד 5 ימים אחורה</p><div class="days">${L.map(x => { const r = d.mine.rep[x]; return `<button data-rd2="${x}" class="${r ? r.st : 'm'}${x === day ? ' on' : ''}"><b>${SDS[spd(x).getDay()]} ${sdm(x)}</b><span>${r ? ic[r.st] : '!'}</span></button>`; }).join('')}</div></section>`
    + (day ? `<section class="card"><h2>${SDS[spd(day).getDay()]} ${sdm(day)}</h2>${sRepForm(day)}</section>` : '<p class="sub">הסבב עוד לא התחיל</p>');
}
function sLog() {
  const d = SD, L = d.mine.log.slice().sort((a, b) => b.d.localeCompare(a.d)), cnt = k => L.filter(l => l.role === k).length;
  return `<section class="card"><h2>📓 הפנקס שלי<span class="sp"></span><small>${L.length} רשומות</small></h2><div class="kp"><div><b>${cnt('w')}</b><span>צפייה</span></div><div><b>${cnt('h')}</b><span>עזרה</span></div><div><b>${cnt('d')}</b><span>ביצוע בהדרכה</span></div></div><div class="note">רק הניתוח או הפעולה, התאריך ומי לימד. בלי שם מטופל ובלי פרטים מזהים.</div>
    <label class="f">מה</label><input class="in" id="lT" list="lProcs" maxlength="80" placeholder="ניתוח או פעולה"><datalist id="lProcs">${d.procs.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <label class="f">התפקיד שלי</label><div class="seg" id="lRole">${Object.keys(SROLE).map((k, i) => `<button data-lr="${k}" class="${i ? '' : 'on'}">${SROLE[k]}</button>`).join('')}</div>
    <label class="f">תאריך</label><input class="in" id="lD" type="date" value="${d.today}" min="${d.rot.start}" max="${d.today}"><label class="f">עם מי</label><input class="in" id="lW" maxlength="60" placeholder="ד״ר ..."><button class="btn pri blk" id="lAdd">הוספה לפנקס</button></section>`
    + `<section class="card"><h2>הרשומות</h2>${L.map(l => `<div class="row"><span class="h">${sdm(l.d)}</span><span class="t"><b>${esc(l.t)}</b><small>${SROLE[l.role] || ''}${l.with ? ' · ' + esc(l.with) : ''}</small></span><button class="btn sm" data-ldel="${l.id}" aria-label="מחיקה">🗑</button></div>`).join('') || '<p class="sub" style="margin:0">עוד אין רשומות</p>'}</section>`;
}
function sEve() {
  const d = SD, c = d.shcfg || {}, up = d.shifts.filter(s => s.d >= d.today), past = d.shifts.filter(s => s.d < d.today).reverse();
  return `<section class="card"><h2>🌙 משמרות ערב במיון</h2><p class="sub">${esc(c.from || '16:00')}–${esc(c.to || '22:00')} · ${esc(c.where || '')}</p>${c.bring ? `<div class="note">🎒 להביא: ${esc(c.bring)}</div>` : ''}${up.map(s => `<div class="row"><span class="h">${SDS[spd(s.d).getDay()]}<small>${sdm(s.d)}</small></span><span class="t"><b>${s.res ? '🩺 ' + esc(s.res) : 'המתמחה האחראי/ת יעודכנו בהמשך'}</b><small>${s.with.length ? 'איתך: ' + esc(s.with.join(', ')) : 'לבד בערב הזה'}</small></span></div>`).join('') || '<p class="sub" style="margin:0">אין משמרות קרובות</p>'}</section>`
    + (past.length ? `<section class="card"><h2>המשמרות שהיו</h2>${past.map(s => { const f = d.mine.shfb[s.d]; return `<div class="row"><span class="h">${sdm(s.d)}</span><span class="t"><b>${s.res ? esc(s.res) : 'משמרת ערב'}</b><small>${s.att === 'x' ? 'לא נכחת' : f ? `✓ משוב: למידה ${f.l} · יחס ${f.i}${f.t ? ' · ' + esc(f.t) : ''}` : 'עוד לא מילאת משוב'}</small></span>${s.att !== 'x' && !f ? `<button class="btn sm" data-shfb="${s.d}">משוב</button>` : ''}</div>${SFB === s.d ? `<div class="note">${[['l', 'כמה למדתי'], ['i', 'יחס הצוות'], ['r', 'הייתי חוזר/ת']].map(([k, l]) => `<label class="f">${l}</label><div class="stars">${[1, 2, 3, 4, 5].map(n => `<button data-fbv="${k}|${n}" class="${SFBV[k] >= n ? 'on' : ''}" aria-label="${l} ${n}">★</button>`).join('')}</div>`).join('')}<label class="f">מה למדתי בערב הזה</label><input class="in" id="fbT" maxlength="160"><button class="btn pri blk" id="fbOk">שליחת המשוב</button></div>` : ''}`; }).join('')}</section>` : '');
}
function sDeck(x) {
  const real = ['scrub-in', 'present'].indexOf(x.deck) >= 0, v = document.createElement('div'); v.className = 'ov';
  v.innerHTML = `<header><b>${esc(x.t)}</b><button id="ovX" aria-label="סגירה">✕</button></header>${real ? `<iframe src="${SDECK + x.deck}.html" title="${esc(x.t)}"></iframe>` : `<div class="sk"><small>CAMPUS · ACADEMY</small><h2>${esc(x.t)}</h2><p>${esc(x.lname || '')}</p><p>המצגת המלאה תופיע כאן אחרי שהמרצה יעלה אותה והיא תעבור אישור.</p></div>`}`;
  document.body.appendChild(v); v.querySelector('#ovX').onclick = () => v.remove();
}
function sbind() {
  $$('[data-wk]').forEach(b => b.onclick = () => { SWK = +b.dataset.wk; sdraw(); });
  $$('[data-deck]').forEach(b => b.onclick = () => sDeck(SD.syl.find(x => x.id === b.dataset.deck)));
  $$('[data-fdeck]').forEach(b => b.onclick = () => sDeck(SD.files.find(x => x.id === b.dataset.fdeck)));
  $$('[data-rate]').forEach(b => b.onclick = () => { const [id, n] = b.dataset.rate.split('|'); ssave('rate', { id, n: +n }, '⭐ תודה על הדירוג'); });
  $$('[data-rd2]').forEach(b => b.onclick = () => { SRD = b.dataset.rd2; SREP = null; sdraw(); });
  const keep = () => { const day = $('#rSave') ? $('#rSave').dataset.rd : ''; const r = SREP && SREP.day === day ? SREP : Object.assign({ st: '', act: [], learn: '', why: '', day: day }, SD.mine.rep[day] || {}, { day: day }); if ($('#rWhy')) r.why = $('#rWhy').value; if ($('#rLearn')) r.learn = $('#rLearn').value; if ($('[data-ract]')) r.act = $$('[data-ract]:checked').map(c => c.dataset.ract); SREP = r; return r; };
  $$('[data-rst]').forEach(b => b.onclick = () => { const r = keep(); r.st = b.dataset.rst; sdraw(); });
  if ($('#rSave')) $('#rSave').onclick = async () => { const r = keep(), day = $('#rSave').dataset.rd; if (!r.st) return stoast('בחרו: הייתי, חלקית או לא הייתי'); if (await ssave('rep', { d: day, st: r.st, why: r.why, act: r.act, learn: r.learn }, '✓ הדיווח נשלח. תודה!')) SREP = null; };
  $$('[data-lr]').forEach(b => b.onclick = () => { $$('[data-lr]').forEach(x => x.classList.toggle('on', x === b)); });
  if ($('#lAdd')) $('#lAdd').onclick = () => { const r = ($('[data-lr].on') || {}).dataset; ssave('log', { t: $('#lT').value, role: r ? r.lr : 'w', d: $('#lD').value, with: $('#lW').value }, '📓 נוסף לפנקס'); };
  $$('[data-ldel]').forEach(b => b.onclick = () => { if (confirm('למחוק את הרשומה?')) ssave('logdel', { id: b.dataset.ldel }, 'נמחק'); });
  $$('[data-shfb]').forEach(b => b.onclick = () => { SFB = b.dataset.shfb; SFBV = { l: 4, i: 4, r: 4 }; sdraw(); });
  $$('[data-fbv]').forEach(b => b.onclick = () => { const [k, n] = b.dataset.fbv.split('|'), t = $('#fbT') ? $('#fbT').value : ''; SFBV[k] = +n; sdraw(); if ($('#fbT')) $('#fbT').value = t; });
  if ($('#fbOk')) $('#fbOk').onclick = async () => { if (await ssave('shfb', Object.assign({ d: SFB, t: $('#fbT').value }, SFBV), '✓ תודה על המשוב')) { SFB = ''; sdraw(); } };
}
sload();
</script>
