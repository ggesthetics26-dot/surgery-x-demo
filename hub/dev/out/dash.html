<style>
:root{
--navy:#0C2A35;--navy2:#13353F;--navy3:#1B4350;--line-d:#2A4852;
--bg:#EDF0F6;--surface:#FFFFFF;--ink:#0C2A35;--ink2:#3E5960;--muted:#6B7B80;
--rule:#D9DFEA;--rule2:#E6EAF2;--green:#187A5C;--green2:#3F6FD8;--green-l:#E4E9F4;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#F2F4F8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:18px;overflow-y:auto}
.brandbox{display:flex;flex-direction:column;gap:10px;padding:0 8px 16px;border-bottom:1px solid var(--line-d)}
.logos{display:flex;align-items:center;gap:10px}
.logos .k{height:40px;border-radius:6px;background:#fff;padding:3px 6px}.logos .c{height:26px;background:#fff;border-radius:6px;padding:3px 6px}.logos .sep{width:1px;height:28px;background:var(--line-d)}
.brandbox b{font-family:var(--serif);font-size:19px;line-height:1.15}
.brandbox span{font-size:12px;color:#A9B8BC}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#C9D4D6;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;text-align:right;font-size:15px}
.nav button svg{width:20px;height:20px;flex-shrink:0;opacity:.85}
.nav button:hover{background:var(--navy2);color:#F2F4F8}
.nav button[aria-current="page"]{background:#F2F4F8;color:var(--navy)}
.subnav{display:flex;gap:6px;padding:10px 28px 0;overflow-x:auto;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}.subnav button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid #DDD5C4;background:#fff;color:#3E5960;border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.subnav button[aria-current="page"]{background:var(--navy);border-color:var(--navy);color:#fff}.subnav .count{background:var(--gold);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}

.nav .count{margin-right:auto;background:var(--gold);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line-d);font-size:13px;color:#A9B8BC;display:flex;flex-direction:column;gap:8px}
.side .foot b{color:#F2F4F8}
.linkbtn{background:none;border:0;color:var(--gold2);padding:0;cursor:pointer;font-weight:700;text-align:right}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:15;background:rgba(237,242,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:12px 28px;display:flex;align-items:center;gap:14px}
.topbar h1{margin:0;font-family:var(--serif);font-size:26px;line-height:1.1}
.topbar .sub{color:var(--muted);font-size:14px}
.ptr-hint{display:none}body.touch .ptr-hint{display:inline;background:none;border:0;padding:0 2px;margin-inline-start:10px;font:inherit;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;cursor:pointer}

.btn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:15px}

.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}

.iconbtn{background:none;border:1px solid var(--rule);border-radius:999px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;color:var(--ink2)}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule2)}

.row .t span{font-size:13px;color:var(--muted)}

/* schedule board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.col{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:180px}

.p-photo{width:112px;height:132px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--navy3);display:grid;place-items:center;border:2px solid var(--line-d)}

const matchIntern = r => list().find(i => (r.email && i.email === r.email) || (pkey(r.phone) && pkey(i.phone) === pkey(r.phone)));
const bookletLink = () => { const b = S.data.content.find(x => x.type === 'ספרות' && /ספרון/.test((x.tag || '') + ' ' + (x.title || '')) && x.link); return b ? b.link : ''; };

function cleanName(s){
  return String(s || '').replace(/^\s*\d+\s*[.)\-]\s*/, '').replace(/[:：()\[\]<>"]/g, ' ')
    .replace(/(^|\s)(טלפון נייד|מספר נייד|מס׳ נייד|נייד|טלפון|טל׳|טל'|פלאפון|סלולרי|המרה|אימייל|מייל|דוא״ל|דוא"ל|כתובת|שם מלא|שם|email|e-mail|mail|phone|mobile|tel|name)\s*[:：\-]?(?=\s|$)/gi, ' ')
    .replace(/[:：()\[\]<>"]/g, ' ').replace(/\s+/g, ' ').trim();
}
const contactTag = () => { const p = String(S.month || '').split(' '); return 'סטאז׳ר ' + p[0] + (p[1] ? ' ' + p[1].slice(-2) : ''); };
const JOIN_BASE = location.origin + '/';

const joinLink = trk => { const p = String(S.month || '').split(' '), mi = HMONTHS.indexOf(p[0]); return mi >= 0 && p[1] ? JOIN_BASE + '?j=' + p[1].slice(-2) + String(mi + 1).padStart(2, '0') + (trk === 'sel' ? 't' : trk === 'selr' ? 's' : '') : S.data.formUrl; };
// a roster row of someone who already registered shows the track from their profile (it may have changed since the list was pasted)
const rTrack = r => { if (!r) return ''; const m = r.key ? null : matchIntern(r); return m ? trackOf(m) : r.track || ''; };
const isSelR = r => rTrack(r) === 'סלקטיב';

const contactName = r => (cleanName(r.name) || 'סטאז׳ר/ית') + ' ' + contactTag() + (isSelR(r) ? ' (סלקטיב)' : isDutyR(r) ? ' (רק תורנויות)' : '');
function parseRoster(text){
  const out = []; let sel = false, stop = false;
  String(text || '').split(/\r?\n/).forEach(line => {
    const raw = line.trim(); if (!raw || stop) return;
    if (/^(בברכה|בתודה|תודה רבה|--)/.test(raw)) { stop = true; return; }
    const hasCt = /[\w.+-]+@[\w-]+\.|(\+?972|0)5\d/.test(raw);
    if (!hasCt && /תורנ[וי]+ות[^\n]*בלבד|רק תורנ/.test(raw)) { sel = 'רק תורנויות'; return; }
    if (!hasCt && /סלקטיב/.test(raw)) { sel = 'סלקטיב'; return; }
    if (!hasCt && (/[:：,]\s*$/.test(raw) || /^(שלום|להלן|בברכה|תודה)/.test(raw))) return;
    const lineSel = /סלקטיב/.test(raw) ? 'סלקטיב' : /רק תורנ/.test(raw) ? 'רק תורנויות' : sel;
    const em = (raw.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/) || [''])[0];
    let rest = raw.replace(em, ' ');
    const ph = (rest.match(/(\+?972[\s-]?|0)5\d([\s-]?\d){7}/) || [''])[0];
    rest = rest.replace(ph, ' ').replace(/[\t,;|]+/g, ' ').replace(/\s+/g, ' ').trim();
    rest = cleanName(rest);
    if (!em && !ph && /(טלפון|אימייל|מייל|email|phone|נייד)/i.test(rest)) return;
    if (!rest && !em && !ph) return;
    out.push({ name: rest.replace(/\(?\s*(סלקטיב|רק תורנויות)\s*\)?/g, ' ').replace(/\s+/g, ' ').trim(), phone: ph.replace(/\s/g, ''), email: em.toLowerCase(), wing: '', track: lineSel || '' });
  });
  return out;
}

function extraSet(plan, er){
  const X = new Set(); plan = plan || {}; er = er || {};

    const n = []; Object.keys(plan).forEach(d => { if (plan[d] === i.key) n.push(d + '|dept'); }); Object.keys(er).forEach(d => { if (er[d] === i.key) n.push(d + '|er'); });

function vLog(){

  $('#main').innerHTML = `

function readImg(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => res(fr.result); fr.readAsDataURL(file); }); }
function cropPhoto(src){
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'crp-bg';
    bg.innerHTML = `<div class="crp-box" role="dialog" aria-modal="true"><b class="crp-t">מרכזו את הפנים בעיגול</b><span class="crp-s">גוררים כדי להזיז · מגדילים עם המחוון או בצביטה</span>
      <div class="crp-st"><img alt=""><i class="crp-ring"></i></div>
      <label class="crp-z"><span>➖</span><input type="range" min="1" max="4" step="0.01" value="1" aria-label="הגדלה"><span>➕</span></label>
      <div class="crp-a"><button class="crp-ok" type="button">✓ שמירה</button><button class="crp-x" type="button">ביטול</button></div></div>`;
    document.body.appendChild(bg);
    const st = bg.querySelector('.crp-st'), img = bg.querySelector('img'), zr = bg.querySelector('input');
    let base = 1, z = 1, x = 0, y = 0, done = false;
    const L = () => st.clientWidth;
    const clamp = () => { const s = base * z, w = img.naturalWidth * s, h = img.naturalHeight * s, n = L(); x = Math.min(0, Math.max(n - w, x)); y = Math.min(0, Math.max(n - h, y)); };
    const draw = () => { clamp(); img.style.transform = `translate(${x}px,${y}px) scale(${base * z})`; };
    const zoomTo = (nz, cx, cy) => { const n = L(); if (cx == null) { cx = n / 2; cy = n / 2; } const s0 = base * z; nz = Math.max(1, Math.min(4, nz)); const s1 = base * nz; x = cx - (cx - x) * s1 / s0; y = cy - (cy - y) * s1 / s0; z = nz; zr.value = z; draw(); };
    const close = v => { if (done) return; done = true; bg.remove(); resolve(v); };
    img.onload = () => { const n = L(); base = Math.max(n / img.naturalWidth, n / img.naturalHeight); z = 1; x = (n - img.naturalWidth * base) / 2; y = (n - img.naturalHeight * base) / 2; draw(); };
    img.onerror = () => close(null);
    img.src = src;
    const pts = new Map(); let last = null, pinch = null;
    st.addEventListener('pointerdown', e => { try { st.setPointerCapture(e.pointerId); } catch (er) {} pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const v = [...pts.values()]; pinch = { d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1, z: z }; last = null; } else last = { x: e.clientX, y: e.clientY }; });
    st.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2 && pinch) { const v = [...pts.values()], r = st.getBoundingClientRect(); zoomTo(pinch.z * Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) / pinch.d, (v[0].x + v[1].x) / 2 - r.left, (v[0].y + v[1].y) / 2 - r.top); return; }
      if (last) { x += e.clientX - last.x; y += e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; draw(); } });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; last = pts.size === 1 ? Object.assign({}, [...pts.values()][0]) : null; };
    st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
    st.addEventListener('wheel', e => { e.preventDefault(); const r = st.getBoundingClientRect(); zoomTo(z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    zr.oninput = () => zoomTo(Number(zr.value));
    bg.querySelector('.crp-x').onclick = () => close(null);
    bg.querySelector('.crp-ok').onclick = () => {
      const n = L(), s = base * z, sx = -x / s, sy = -y / s, sw = n / s;
      let px = 480, q = .86, out = '';
      for (let k = 0; k < 9; k++) { const c = document.createElement('canvas'); c.width = c.height = px; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, px, px); g.drawImage(img, sx, sy, sw, sw, 0, 0, px, px); out = c.toDataURL('image/jpeg', q); if (out.length < 46000) break; px = Math.round(px * .88); q = Math.max(.55, q - .05); }
      close(out);
    };
  });
}
function shrinkPic(f){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const g = new Image(); g.onerror = rej; g.onload = () => { let w = 560, q = .82, out = ''; for (let n = 0; n < 9; n++) { const k = Math.min(1, w / Math.max(g.width, g.height)), c = document.createElement('canvas'); c.width = Math.round(g.width * k); c.height = Math.round(g.height * k); c.getContext('2d').drawImage(g, 0, 0, c.width, c.height); out = c.toDataURL('image/jpeg', q); if (out.length < 46000) break; w = Math.round(w * .82); q = Math.max(.5, q - .06); } res(out); }; g.src = fr.result; }; fr.readAsDataURL(f); }); }

    <label class="switch"><input type="checkbox" id="pdMail">📧 להודיע על העדכון רק למי שהשתנה לו (${ch.length}): מייל אישי וסימון ״עודכן״ באפליקציה</label>
    <div class="hint">בלי סימון: מתעדכן בשקט, בלי מיילים ובלי התראה.</div>` : '<div class="hint">אין שינוי אצל אף סטאז׳ר. הלוח יישמר בשקט, בלי מיילים.</div>')
    : `<label class="switch"><input type="checkbox" id="pdMail" ${mail ? 'checked' : ''}>📧 לשלוח לכל סטאז׳ר מייל אישי ${esc(o.mailWhat)}</label>
    <div class="hint">באפליקציה יופיע להם סימון ״חדש״ עד שיפתחו את הלשונית. אחרי הפרסום תקבלו הודעה מוכנה לקבוצת הוואטסאפ.</div>`}
  </div><div class="modal-foot" id="pdFoot"><button class="btn primary" id="pdGo">📣 פרסום</button><button class="btn" id="pdX">ביטול</button></div></div></div>`;
  $('#mbg').onclick = e => { if (e.target.id === 'mbg' && !o.busy) closeModal(); };
  $('#pdX').onclick = closeModal;
  $('#pdGo').onclick = async () => {
    const m = !!($('#pdMail') && $('#pdMail').checked); if (!o.update) { try { localStorage.setItem('sx_pubmail_' + o.kind, m ? '1' : '0'); } catch (e) {} }
    const b = $('#pdGo'); b.disabled = true; b.textContent = 'מפרסם…'; $('#pdX').disabled = true; o.busy = true;
    try { await o.publish(o.update ? { notify: m, keys: ch.map(c => c.key) } : { notify: true }); } catch (e) { o.busy = false; b.disabled = false; b.textContent = 'נסו שוב'; $('#pdX').disabled = false; toast(e.message || 'הפרסום נכשל'); return; }
    let ml = '';
    if (m) { b.textContent = 'שולח מיילים…';
      try { const r = await call('wa_notifyPub', S.code, o.kind, S.month, o.from || '', o.update ? { keys: ch.map(c => c.key), update: true } : {}); ml = `📧 נשלחו ${r.sent} מיילים ${o.update ? 'על העדכון' : 'אישיים'}` + (r.same ? ` · ${r.same} כבר קיבלו את אותו תוכן` : '') + (r.failed ? ` · ${r.failed} נכשלו` : '') + (r.noMail.length ? ` · בלי מייל: ${r.noMail.join(', ')}` : ''); }
      catch (e) { ml = '⚠️ הפרסום הצליח, אבל המיילים לא נשלחו: ' + (e.message || 'שגיאה'); } }
    o.busy = false;
    const quiet = o.update && !m;
    $('#pdBody').innerHTML = `<div class="pd-ok">✓ ${esc(o.update ? o.updDone : o.done)}</div>${quiet ? '<div class="pd-ml">🔕 עודכן בשקט: לא נשלחו מיילים ולא התראות</div>' : ml ? `<div class="pd-ml">${esc(ml)}</div>` : ''}
      ${quiet ? '' : `<label class="f">הודעה לקבוצת הוואטסאפ<textarea id="pdWa" rows="6">${esc(o.update ? o.updWa(nm) : o.wa)}</textarea></label>`}`;
    $('#pdFoot').innerHTML = `${quiet ? '' : '<button class="btn primary" id="pdCopy">📋 העתקת ההודעה</button>'}${o.image ? '<button class="btn" id="pdImg">🖼️ תמונה לשליחה</button>' : ''}<button class="btn" id="pdClose">סגירה</button>`;
    if ($('#pdCopy')) $('#pdCopy').onclick = () => copy($('#pdWa').value, 'ההודעה הועתקה. מדביקים בקבוצה');
    if ($('#pdImg')) $('#pdImg').onclick = () => { closeModal(); o.image(); };
    $('#pdClose').onclick = () => { closeModal(); if (o.after) o.after(); };
  };
}
function closeModal(){ $('#modal').innerHTML = ''; }
function editItem(it){
if (roBlock()) return;
it = Object.assign({ type: 'הודעה', month: S.month, target: 'all', title: '', body: '', day: null, date: '', time: '', link: '', tag: '', pinned: false }, it || {});
if (!it.id && it.type === 'מפגש' && it.day === null && !it.date) it.day = 3;
const isS = it.type === 'מפגש', isM = it.type === 'הודעה', isT = it.type === 'הדרכה', isL = isT || it.type === 'ספרות' || it.type === 'סמינר' || it.type === 'וידאו' || it.type === 'מדריך';
const interns = list();
const months = [ALL].concat([...new Set([...S.data.months, ...S.data.interns.map(i => i.month)])]);
const when = it.date ? 'date' : 'week';
const head = { 'מפגש': '🗓️ ' + (it.id ? 'עריכת מפגש' : 'מפגש חדש'), 'הודעה': '📣 ' + (it.id ? 'עריכת הודעה' : 'הודעה חדשה'), 'ספרות': '📚 ' + (it.id ? 'עריכת מקור' : 'מקור חדש'), 'סמינר': '🎓 ' + (it.id ? 'עריכת סמינר' : 'סמינר חדש'), 'וידאו': '🎬 ' + (it.id ? 'עריכת קישור' : 'אתר או סרטון חדש'), 'הדרכה': '🛡️ ' + (it.id ? 'עריכת הדרכה' : 'הדרכה חדשה'), 'מדריך': '📘 ' + (it.id ? 'עריכת מדריך' : 'מדריך חדש') }[it.type];
$('#modal').innerHTML = `<div class="modal" id="mbg"><div class="modal-box" role="dialog" aria-modal="true"><div class="modal-head">${head}</div><div class="modal-body">
<label class="f">${isT ? 'שם ההדרכה' : isL ? 'שם הספר / המאמר' : 'כותרת'}<input id="mTitle" value="${esc(it.title)}" maxlength="200"></label>
<label class="f">${isT ? 'נקודות ההדרכה · שורה לכל נקודה' : isS ? 'פירוט (אופציונלי)' : isM ? 'תוכן ההודעה' : 'תיאור קצר'}<textarea id="mBody"${isT ? ' style="min-height:200px"' : ''}>${esc(it.body)}</textarea></label>
${isS ? `<div class="f">מתי<div class="seg" id="mWhen"><button data-w="week" aria-pressed="${when === 'week'}">כל שבוע</button><button data-w="date" aria-pressed="${when === 'date'}">בתאריך מסוים</button></div></div>
<div class="fields"><label class="f" id="wDay" ${when === 'date' ? 'hidden' : ''}>יום<select id="mDay">${DAYS.map((d, k) => `<option value="${k}"${it.day === k ? ' selected' : ''}>${d}</option>`).join('')}</select></label>
<label class="f" id="wDate" ${when === 'week' ? 'hidden' : ''}>תאריך<input id="mDate" type="date" value="${esc(it.date)}"></label>
<label class="f">שעה<input id="mTime" value="${esc(it.time)}" placeholder="10:00"></label></div>
<label class="f">סוג<select id="mTag">${TAGS.map(t => `<option value="${t[0]}"${(it.tag || 'meet') === t[0] ? ' selected' : ''}>${t[1]}</option>`).join('')}</select></label>` : ''}
${isL ? `<div class="fields"><label class="f">${isT ? 'מספר בסדר ההדרכות' : 'קטגוריה'}<input id="mTag" value="${esc(it.tag)}" placeholder="${isT ? '1' : 'ספר / מאמר / סרטון / ספרון'}"></label><label class="f">${isT ? 'קישור לנוהל הרשמי (אופציונלי)' : 'קישור (אופציונלי)'}<input id="mLink" value="${esc(it.link)}" placeholder="הדביקו קישור"></label></div>` : ''}
${isM ? `<label class="f">קישור (אופציונלי)<input id="mLink" value="${esc(it.link)}" placeholder="הדביקו קישור"></label>` : ''}
<div class="fields"><label class="f">חודש<select id="mMonth">${months.map(m => `<option${m === it.month ? ' selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
${!isL ? `<label class="f">למי<select id="mTarget"><option value="all">כל הסבב</option><option value="wing:צפון"${it.target === 'wing:צפון' ? ' selected' : ''}>אגף צפון</option><option value="wing:דרום"${it.target === 'wing:דרום' ? ' selected' : ''}>אגף דרום</option>${interns.map(i => `<option value="${esc(i.key)}"${it.target === i.key ? ' selected' : ''}>${esc(i.name)}</option>`).join('')}${it.target !== 'all' && it.target.indexOf('wing:') !== 0 && !interns.some(i => i.key === it.target) ? `<option value="${esc(it.target)}" selected>${esc(internName(it.target))}</option>` : ''}</select></label>` : ''}</div>
${isM ? `<label class="switch"><input type="checkbox" id="mPin" ${it.pinned ? 'checked' : ''}>📌 להצמיד לראש העמוד</label>` : ''}
</div><div class="modal-foot"><button class="btn primary" id="mSave">שמירה</button><button class="btn" id="mCancel">ביטול</button>${it.id ? '<div class="spacer"></div><button class="btn danger" id="mDel">מחיקה</button>' : ''}</div></div></div>`;
$('#mbg').onclick = e => { if (e.target.id === 'mbg') closeModal(); };
$('#mCancel').onclick = closeModal;
if (isS) document.querySelectorAll('#mWhen button').forEach(b => b.onclick = () => { document.querySelectorAll('#mWhen button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#wDay').hidden = b.dataset.w !== 'week'; $('#wDate').hidden = b.dataset.w !== 'date'; });
$('#mTitle').focus();
$('#mSave').onclick = async () => {
const out = { id: it.id || '', type: it.type, title: $('#mTitle').value.trim(), body: $('#mBody').value.trim(), month: $('#mMonth').value, target: $('#mTarget') ? $('#mTarget').value : 'all' };
if (!out.title) { toast('חסרה כותרת'); return; }
if (isS) { const wk = document.querySelector('#mWhen [aria-pressed="true"]').dataset.w === 'week'; out.day = wk ? Number($('#mDay').value) : ''; out.date = wk ? '' : $('#mDate').value; out.time = $('#mTime').value.trim(); out.tag = $('#mTag').value; if (!wk && !out.date) { toast('בחרו תאריך'); return; } }
if (isL) { out.tag = $('#mTag').value.trim(); out.link = $('#mLink').value.trim(); }
if (isM) { out.link = $('#mLink').value.trim(); out.pinned = $('#mPin').checked; }
const b = $('#mSave'); b.disabled = true; b.textContent = 'שומר…';
try { S.data.content = await call('wa_saveContent', S.code, out); closeModal(); toast('נשמר. הסטאז׳רים כבר רואים את זה'); render(); }
catch(e){ toast(e.message || 'השמירה נכשלה'); b.disabled = false; b.textContent = 'שמירה'; }
};
if ($('#mDel')) $('#mDel').onclick = async () => { const b = $('#mDel'); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'ללחוץ שוב למחיקה'; return; } try { S.data.content = await call('wa_deleteContent', S.code, it.id); closeModal(); toast('נמחק'); render(); } catch(e){ toast('המחיקה נכשלה'); } };
}

// start: a code saved in this frame signs in at once; otherwise the device key on the wrapper site does, with the last snapshot shown meanwhile
(async function start(){
  const c = store.get('sx_code');
  if (c) return boot(c);
  const g = await sxBridge('get', 'sx_dev'), t = g && g.v;
  if (!t) return boot('');
  S.dev = t;
  const pc = call('wa_devLogin', t).catch(() => null);
  const sg = await sxBridge('get', 'sx_snap');
  let sn = null; try { sn = sg && sg.v ? JSON.parse(sg.v) : null; } catch (e) {}
  if (sn && sn.dev === devTag(t) && sn.r && sn.r.state === 'ok') { try { applyBoot('', sn.r); render(); document.body.classList.add('syncing'); } catch (e) { S.data = null; } }
  const code = await pc;
  if (!code) { S.dev = ''; sxBridge('del', 'sx_dev'); sxBridge('del', 'sx_snap'); S.data = null; S.me = null; return boot(''); }
  store.set('sx_code', code); boot(code);
})();
installPullToRefresh(pullRefresh);

// design v3: faint Leonardo da Vinci anatomy in the dark panels and behind the page, as in the department portal.
// The drawings are white ink on transparent, served by the site; a missing one just disappears
const ARTB3 = (location.pathname.indexOf('/dev/out/') >= 0 ? new URL('../../../', location.href).href : location.origin + '/') + 'ops/art/';
const V3ART = [['.cc', 'organs'], ['.side', 'vessels'], ['.login', 'organs'], ['.hero', 'organs'], ['.imon', 'organs']];
function v3Art() {
  V3ART.forEach(([q, k]) => document.querySelectorAll(q).forEach(el => { if ([...el.children].some(c => c.classList && c.classList.contains('v3a'))) return;
    const i = document.createElement('img'); i.className = k === 'organs' ? 'v3a v3c' : 'v3a'; i.alt = ''; i.loading = 'lazy'; i.referrerPolicy = 'no-referrer'; i.onerror = () => i.remove(); i.src = ARTB3 + k + '.webp'; el.appendChild(i); }));
  if (!document.querySelector('.v3bg')) { const d = document.createElement('div'); d.className = 'v3bg'; const i = document.createElement('img'); i.alt = ''; i.className = 'v3c'; i.referrerPolicy = 'no-referrer'; i.onerror = () => d.remove(); i.src = ARTB3 + 'organs.webp'; d.appendChild(i); document.body.prepend(d); }
}
try { new MutationObserver(() => { clearTimeout(v3Art.t); v3Art.t = setTimeout(v3Art, 80); }).observe(document.body, { childList: true, subtree: true }); v3Art(); } catch (e) {}

// "what's new in surgery", the same strip as in the department portal: the latest papers from the surgical journals (PubMed),
// innovation and FDA devices. The department portal refreshes them every few hours and copies them here; a box with class nwsBox shows them
const NW = { tab: 'res', busy: 0, tried: 0, data: null }, NW_ART = (location.pathname.indexOf('/dev/out/') >= 0 ? new URL('../../../', location.href).href : location.origin + '/') + 'ops/art/tools.webp';
const NJ_COL = { 'Ann Surg': '#1D4E7E', 'JAMA Surg': '#A3402E', 'Br J Surg': '#00796A', 'J Am Coll Surg': '#408C9C', 'Surg Endosc': '#B5862E', 'N Engl J Med': '#B0242A', 'Lancet': '#6A5330', 'Surgery': '#2F6FA8', 'Ann Surg Oncol': '#5FACBD', 'Dis Colon Rectum': '#187A5C', 'Obes Surg': '#C9893F', 'HPB (Oxford)': '#4A86C5', 'World J Surg': '#3D5562', 'J Trauma Acute Care Surg': '#C9503A', 'Surg Obes Relat Dis': '#8E5F1E', 'Hernia': '#1C4250' };
const DEV_IC = t => /mesh|hernia/i.test(t) ? '🕸' : /stapl|staple/i.test(t) ? '📎' : /suture/i.test(t) ? '🧵' : /electro|ultrason|harmonic|seal|coag/i.test(t) ? '⚡' : /wound|negative pressure/i.test(t) ? '🩹' : /robot/i.test(t) ? '🤖' : /endoscop|laparoscop|camera/i.test(t) ? '🔭' : /clip|ligat/i.test(t) ? '🔗' : '🛠';
const nwAgo = iso => { const d = Math.round((Date.now() - new Date(iso).getTime()) / 864e5); return d <= 0 ? 'היום' : d === 1 ? 'אתמול' : d < 30 ? `לפני ${d} ימים` : new Date(iso).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' }); };
const nwDate = s => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' }); };
function newsHtml(N) {
  if (N && N.all) { const keys = N.def || [], ta = new Set(N.all.filter(x => keys.indexOf(x.k) >= 0).map(x => x.ta)), f = L => { const r = (L || []).filter(x => ta.has(x.j)); return r.length ? r : L || []; };
    N = Object.assign({}, N, { res: f(N.res).slice(0, 18), inn: f(N.inn).slice(0, 10), j: N.all.filter(x => keys.indexOf(x.k) >= 0).map(x => x.name) }); }
  if (!N || !((N.res || []).length || (N.dev || []).length)) return NW.busy ? `<section class="nws"><div class="nwh"><div class="nwt"><small>מה חדש בעולם הכירורגיה</small><b>מחקר · חדשנות · מכשירים</b></div></div><p class="nwz">טוען את המאמרים האחרונים…</p></section>` : '';
  const T = { res: ['📚 מחקר', N.res || []], inn: ['🤖 חדשנות', N.inn || []], dev: ['🛠 מכשירים', N.dev || []] }, L = T[NW.tab][1];
  const paper = x => `<a class="nwc" href="${esc(x.u)}" target="_blank" rel="noopener" style="--jc:${NJ_COL[x.j] || '#0C2A35'}"><span class="nwj">${esc(x.j)}</span><b dir="ltr">${esc(x.t)}</b><span class="nwm" dir="ltr">${esc(x.au || '')}${x.n > 1 ? ' et al.' : ''}</span><span class="nwf"><i>${nwDate(x.d)}</i><em>PubMed ↗</em></span></a>`;
  const dev = x => `<a class="nwc dv" href="${esc(x.u)}" target="_blank" rel="noopener"><span class="nwj"><i>${DEV_IC(x.t + ' ' + x.kind)}</i>${esc(x.kind || 'FDA 510(k)')}</span><b dir="ltr">${esc(x.t)}</b><span class="nwm" dir="ltr">${esc(x.co || '')}</span><span class="nwf"><i>${nwDate(x.d)} · ${esc(x.k || '')}</i><em>FDA ↗</em></span></a>`;
  return `<section class="nws"><img class="nwa" src="${NW_ART}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><div class="nwh"><div class="nwt"><small>מה חדש בעולם הכירורגיה</small><b>${(N.j || []).slice(0, 6).join(' · ')}</b></div><div class="nwtabs">${Object.keys(T).map(k => `<button type="button" data-nwt="${k}" class="${NW.tab === k ? 'on' : ''}">${T[k][0]}<u>${T[k][1].length}</u></button>`).join('')}</div><span class="nwu">עודכן ${nwAgo(N.at)}</span></div><div class="nwr">${L.map(NW.tab === 'dev' ? dev : paper).join('') || '<p class="nwz">אין פריטים כרגע</p>'}</div><p class="nws-src">${NW.tab === 'dev' ? 'אישורי 510(k) אחרונים של ה-FDA לכירורגיה כללית (openFDA)' : 'המאמרים האחרונים מ-PubMed · לחיצה פותחת את המאמר'}</p></section>`;
}
function newsMount(key) {
  if (typeof NW === 'undefined') return;
  const draw = () => document.querySelectorAll('.nwsBox').forEach(b => { b.innerHTML = newsHtml(NW.data); b.querySelectorAll('[data-nwt]').forEach(x => x.onclick = () => { NW.tab = x.dataset.nwt; draw(); }); });
  key = key || (window.__MOCK ? 'mock' : ''); draw(); if (NW.data || NW.tried || !key) return;
  NW.tried = 1; NW.busy = 1; draw(); call('wa_news', key).then(r => { if (r && r.at) NW.data = r; }).catch(() => {}).then(() => { NW.busy = 0; draw(); });
}
