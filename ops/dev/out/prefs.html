    const top = `<rect x="24" y="46" width="94" height="48" rx="9" fill="url(#gaMat)" ${GP}/><path d="M116 50L204 22L208 34L120 62ZM116 90L204 118L208 106L120 78Z" fill="url(#gaMat)" ${GP}/>${[[42, 8], [42, 94]].map(([x, y]) => `<rect x="${x}" y="${y}" width="16" height="38" rx="4" fill="url(#gvHd2)" ${GP}/>`).join('')}<rect x="6" y="56" width="20" height="28" rx="6" fill="url(#gaMat)" ${GP}/>`;

      + ['M116 60L200 30', 'M116 80L200 110'].map(d => `<path d="${d}" stroke="#22414C" stroke-width="15" stroke-linecap="round"/><path d="${d}" stroke="#9FD3E0" stroke-width="13" stroke-linecap="round"/>`).join('')

      + `<circle cx="22" cy="70" r="10.6" fill="url(#gaSk)" ${GP}/><path d="M11.4 70a10.6 10.6 0 0 1 10.6 -10.6v21.2a10.6 10.6 0 0 1 -10.6 -10.6z" fill="#7FB3C6" ${GP}/><path d="M30 70h8" stroke="#2F6FA8" stroke-width="1.4"/>`;
    g = `<g transform="translate(8 0)">${top}${body}<ellipse cx="172" cy="70" rx="8" ry="13" fill="url(#gaK)" ${GP}/><circle cx="172" cy="70" r="5.4" fill="#7FB3C6" ${GP}/><text x="172" y="91" font-size="8" font-weight="800" text-anchor="middle" fill="#1C4250" font-family="Heebo,Arial">מנתח/ת</text></g>`; }
  return `<svg class="gpos" viewBox="0 0 240 140" role="img" aria-label="${esc((POS_K.find(x => x[0] === k) || [])[1] || '')}"><defs><linearGradient id="gpBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8F1ED"/></linearGradient></defs><rect width="240" height="140" rx="16" fill="url(#gpBg)"/>${g}</svg>`;

<style>
/* the surgeon's "חדר ניתוח" tab in the personal app (31/10/2026) */
.so-day{margin-bottom:12px}.so-day>h3{font-family:'Frank Ruhl Libre',Georgia,serif;margin:4px 2px 8px;font-size:19px}

<script>
IC.or = '<path d="M4 20l9-9"/><path d="M13 11l3-3c1.5-1.5 4-1.5 5 0l-6 6"/><path d="M15 14l-2-2"/>'; BGART.or = 'thorax';
// ---------- "חדר ניתוח": my cases with the standard card, a special request per case, and "הכרטיסים שלי" ----------
let SPD = null;
const SO_PZ = ['שכיבה על הגב (Supine)', 'Reverse Trendelenburg', 'Trendelenburg', 'ליתוטומיה / Lloyd-Davies', 'French / רגליים פתוחות', 'שכיבה על הצד (Lateral decubitus)', 'שכיבה על הבטן (Jackknife)', 'כרית מתחת לכתפיים (הארכת צוואר)'];
async function soLoad() { try { SPD = await call('ops_spMe', TOKEN); } catch (e) { SPD = null; return false; } return !!SPD; }
const soCards = () => (SPD && SPD.cards && (SPD.cards.list || []).length ? SPD.cards.list : ((SPD && SPD.def) || {}).cards || []);
const soCat = () => (SPD && SPD.equip && (SPD.equip.groups || []).length ? SPD.equip : ((SPD && SPD.def) || {}).equip || { groups: [] });
const soCard = id => soCards().find(c => c.id === id);
function soEff(c) { const k = c.pc ? soCard(c.pc) : null; if (!k) return null; const sp = (c.s || [])[0] === A.me.id ? ((SPD.sp || {}).cards || {})[k.id] : null; return sp ? Object.assign({}, k, sp, { mine: 1 }) : k; }
function soCase(x) { const c = x.c, k = soEff(c), q = String(x.q), st = c.st || (k ? { pz: k.pz, arms: k.arms, tilt: k.tilt, mon: k.mon, team: k.team } : {}), notes = (Array.isArray(c.sn) ? c.sn : c.sn ? [c.sn] : []);
  const spec = !!c.n || notes.length || (k && JSON.stringify(c.e || []) !== JSON.stringify(k.eq || []));
  return `<article class="so-c${spec ? ' spec' : ''}"><div class="so-h"><i>${x.j + 1}</i><span><b>${esc(q.split('@')[0])}</b><small>${esc(x.room)}${q.split('@')[1] ? ' · ' + ({ L: 'לפרוסקופי', R: 'רובוטי', O: 'פתוח' })[q.split('@')[1]] : ''}${k && k.dur ? ' · ⏱ ' + k.dur + ' ד׳' : ''}</small></span></div>
    ${k && k.mine ? `<div class="so-pref">🩺 לפי הכרטיס שלך${k.note ? ' · ' + esc(k.note) : ''}</div>` : ''}${spec ? `<div class="so-spec">⚠ בקשה מיוחדת לניתוח הזה${c.n ? ': ' + esc(c.n) : ''}${notes.map(n => `<br>📝 ${esc(n.by || '')}: ${esc(n.t)}`).join('')}</div>` : ''}
    <div class="so-eq">${(c.e || (k && k.eq) || []).map(t => `<span>${gaArt(gaKey(t))}${esc(t)}</span>`).join('') || '<span>אין ציוד מיוחד</span>'}</div>
    ${(st.pz || []).length ? `<div class="so-art">${posSvg(posKey(st))}${roomSvg(st, c.e)}</div>` : ''}
    <button class="lnk" data-sn="${x.ws}|${x.d}|${x.ri}|${x.j}">＋ בקשה מיוחדת או הערה לצוות</button></article>`; }
function vOr() {
  if (!SPD) { soLoad().then(() => show()); return '<p class="cap" style="padding:20px">טוען…</p>'; }
  const L = myCases(), byD = {}; L.forEach(x => { (byD[x.d] = byD[x.d] || []).push(x); }); const mine = (SPD.sp || {}).cards || {};
  return `<section class="hcard"><h3>🧰 חדר ניתוח · הניתוחים שלי</h3><p class="cap" style="margin:0">8 הימים הקרובים · כל ניתוח עם הציוד והתנוחה הקבועים. משהו מיוחד? "＋ בקשה מיוחדת" והצוות מקבל התראה</p></section>
   ${Object.keys(byD).sort().map(d => `<section class="so-day"><h3>${DAYS[pd(d).getDay()]} ${+d.slice(8)}/${+d.slice(5, 7)}</h3>${byD[d].map(soCase).join('')}</section>`).join('') || '<section class="hcard"><p class="cap">אין לך ניתוחים בימים הקרובים</p></section>'}
   <section class="hcard"><h3>🩺 הכרטיסים שלי</h3><p class="cap" style="margin:0 0 8px">ההעדפות הקבועות שלך לכל סוג ניתוח: מכשיר, ציוד, תנוחה והערה. ניתוח שלך מתחיל מהן</p><div class="so-cards">${soCards().map(c => `<button class="${mine[c.id] ? 'mine' : ''}" data-soc="${c.id}"><b>${esc(c.n)}</b><small>${mine[c.id] ? '🩺 הכרטיס שלי' : 'כמו המערך'}</small></button>`).join('')}</div></section>`;
}
function soEdit(cid) { const k = soCard(cid), X = ((SPD.sp || {}).cards || {})[cid] || {}, o = { eq: (X.eq || k.eq || []).slice(), pz: (X.pz || k.pz || []).slice(), en: X.en || '', note: X.note || '' };
  const bg = document.createElement('div'); bg.className = 'sheetbg';
  const draw = () => { bg.innerHTML = `<div class="sheet"><h3>🩺 ${esc(k.n)}</h3><p class="cap">הכרטיס שלך · מה שתסמן/י כאן מחליף את הכרטיס של המערך בניתוחים שלך</p>
    <b>הציוד שלי</b><div class="so-tiles">${soCat().groups.flatMap(g => g.items).map(t => `<button data-sq="${esc(t)}" class="${o.eq.indexOf(t) >= 0 ? 'on' : ''}">${gaArt(gaKey(t))}${esc(t)}</button>`).join('')}</div>
    <b>תנוחה</b><div class="snk">${SO_PZ.map(v => `<button data-sz="${esc(v)}" class="${o.pz.indexOf(v) >= 0 ? 'on' : ''}">${esc(v)}</button>`).join('')}</div>
    <b>מכשיר אנרגיה</b><input id="soEn" value="${esc(o.en)}" placeholder="${esc(k.en || '')}" maxlength="160" style="width:100%;font:inherit;font-size:16px;border:1px solid #CFDAD5;border-radius:12px;padding:8px;box-sizing:border-box">
    <b>הערה קבועה לצוות</b><textarea id="soNo" maxlength="300" style="width:100%;min-height:70px;font:inherit;font-size:16px;border:1px solid #CFDAD5;border-radius:12px;padding:8px;box-sizing:border-box">${esc(o.note)}</textarea>
    <button class="pbtn" id="soOk">שמירה</button>${Object.keys(X).length ? '<button class="pbtn ghost" id="soRs">↺ חזרה לכרטיס המערך</button>' : ''}<button class="pbtn ghost" id="soNo2">ביטול</button></div>`;
    const keep = () => { o.en = bg.querySelector('#soEn').value.trim(); o.note = bg.querySelector('#soNo').value.trim(); };
    bg.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => { keep(); const t = b.dataset.sq, i = o.eq.indexOf(t); if (i >= 0) o.eq.splice(i, 1); else o.eq.push(t); draw(); });
    bg.querySelectorAll('[data-sz]').forEach(b => b.onclick = () => { keep(); const t = b.dataset.sz, i = o.pz.indexOf(t); if (i >= 0) o.pz.splice(i, 1); else o.pz.push(t); draw(); });
    bg.querySelector('#soNo2').onclick = () => bg.remove();
    const save = async x => { try { SPD.sp = await call('ops_spMeSave', TOKEN, cid, x); bg.remove(); toast2('הכרטיס שלך נשמר'); show(); } catch (e) { toast2(e.message); } };
    if (bg.querySelector('#soRs')) bg.querySelector('#soRs').onclick = () => save(null);
    bg.querySelector('#soOk').onclick = () => { keep(); const x = {}; if (JSON.stringify(o.eq) !== JSON.stringify(k.eq || [])) x.eq = o.eq; if (JSON.stringify(o.pz) !== JSON.stringify(k.pz || [])) x.pz = o.pz; if (o.en) x.en = o.en; if (o.note) x.note = o.note; save(Object.keys(x).length ? x : null); }; };
  document.body.appendChild(bg); bg.onclick = e => { if (e.target === bg) bg.remove(); }; draw(); }
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-soc]'); if (b) soEdit(b.dataset.soc); });
// my cases in the next 8 days: where I am the case's surgeon (or, before one was set, in the room's team)
function myCases() { const out = [], me = A.me.id; for (let i = 0; i < 8; i++) { const d = add(TODAY, i), W = weekOf(d), D = W && W.days && W.days[d]; if (!D) continue;
  (D.or || []).forEach((r, ri) => (r.proc || []).forEach((q, j) => { const c = (r.cx || [])[j] || {}, mine = (c.s || []).length ? c.s.indexOf(me) >= 0 : (r.ids || []).some(x => x.id === me); if (mine) out.push({ ws: sunday(d), d, ri, j, room: r.n, q, c }); })); } return out; }
const SNK = { gen: 'כללי', pos: 'תנוחה', eq: 'ציוד', prep: 'הכנות' }, snL = c => !c || !c.sn ? [] : Array.isArray(c.sn) ? c.sn : [Object.assign({ k: 'gen' }, c.sn)];
function snEdit(key) { const [ws, d, ri, j] = key.split('|'), x = myCases().find(y => y.ws === ws && y.d === d && y.ri === +ri && y.j === +j); if (!x) return;
  let k = 'gen'; const mine = kk => (snL(x.c).find(n => n.pid === A.me.id && n.k === kk) || {}).t || '';
  const bg = document.createElement('div'); bg.className = 'sheetbg'; bg.innerHTML = `<div class="sheet"><h3>📝 בקשה מיוחדת או הערה לצוות</h3><p class="cap">${esc(x.room)} · ${esc(String(x.q).split('@')[0])} · מופיע לצוות חדר הניתוח. בלי פרטי מטופלים: רק תנוחה, ציוד והכנות</p><div class="snk">${Object.keys(SNK).map(kk => `<button data-snk="${kk}" class="${kk === k ? 'on' : ''}">${SNK[kk]}</button>`).join('')}</div><textarea id="snT" maxlength="300" style="width:100%;min-height:110px;font:inherit;font-size:16px;border:1px solid #CFDAD5;border-radius:12px;padding:10px;box-sizing:border-box">${esc(mine(k))}</textarea><button class="pbtn" id="snOk">שמירה</button><button class="pbtn ghost" id="snNo">ביטול</button></div>`;
  document.body.appendChild(bg); bg.onclick = e => { if (e.target === bg) bg.remove(); }; bg.querySelector('#snNo').onclick = () => bg.remove();
  bg.querySelectorAll('[data-snk]').forEach(b => b.onclick = () => { k = b.dataset.snk; bg.querySelectorAll('[data-snk]').forEach(y => y.classList.toggle('on', y === b)); bg.querySelector('#snT').value = mine(k); });
  bg.querySelector('#snOk').onclick = async () => { const t = bg.querySelector('#snT').value.trim(); if (/\d{6,}|ת[\.״"']?ז|בן\s{0,2}\d|בת\s{0,2}\d|גיל\s{0,2}\d/.test(t)) return toast2('בלי פרטי מטופלים');
    try { const r = await call('ops_caseNoteMe', TOKEN, ws, d, +ri, +j, t, k); const R = weekOf(d).days[d].or[+ri]; R.cx = R.cx || []; while (R.cx.length <= +j) R.cx.push({}); R.cx[+j] = R.cx[+j] || {}; if (r.sn) R.cx[+j].sn = r.sn; else delete R.cx[+j].sn; bg.remove(); toast2('נשמר · צוות חדר הניתוח יראה'); show(); } catch (e) { toast2(e.message); } }; }
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-sn]'); if (b) { e.preventDefault(); snEdit(b.dataset.sn); } });
// the tab: for the roles the owner opened it to (default: seniors), next to the plan; ?tab=or opens it
{ const sh1 = shell; shell = function () { if (A && (A.gearRoles || ['senior']).indexOf(A.me.role) >= 0 && !TABS.some(t => t[0] === 'or')) { const i = TABS.findIndex(t => t[0] === 'week'); TABS.splice(i < 0 ? 1 : i + 1, 0, ['or', 'חדר ניתוח']); if (/[?&]tab=or/.test(location.search) && !shell.or0) { shell.or0 = 1; TAB = 'or'; } } return sh1.apply(this, arguments); }; }
{ const sw0 = show; show = function () { if (TAB !== 'or') return sw0.apply(this, arguments); setTimeout(pfBarPaint, 0); V().innerHTML = `<div class="wrap2">${vOr()}</div>`; }; }
