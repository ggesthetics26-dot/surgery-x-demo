<style>
:root{--navy:#0C2A35;--ink:#0C2A35;--ink2:#3E5960;--muted:#6B7B80;--bg:#EEF1F7;--card:#FFFFFF;--rule:#DDE3EE;--ind:#2C5F6E;--cy:#B08A45;--vi:#9A7B4F;--sky:#D9C79E;--red:#A3402E;--red-l:#FBEDEA;--ok:#187A5C;--ok-l:#E6F4EE;--amber:#B5862E;--amber-l:#FBF3E4;--grad:linear-gradient(120deg,#0C2A35,#1C4250 60%,#2C5F6E)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E9EEF7;--ink2:#BAC6D6;--muted:#8D9BAF;--bg:#06141B;--card:#0E2530;--rule:#1F3B48;--red-l:#3A1F1A;--ok-l:#12312A;--amber-l:#33291A}}
:root[data-theme="dark"]{--ink:#E9EEF7;--ink2:#BAC6D6;--muted:#8D9BAF;--bg:#06141B;--card:#0E2530;--rule:#1F3B48;--red-l:#3A1F1A;--ok-l:#12312A;--amber-l:#33291A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo','Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.top{background:linear-gradient(125deg,#071C24,#0C2A35 45%,#163F4D);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top img{width:36px;height:36px;border-radius:10px}
.brand b{display:block;font-weight:900;font-size:19px;direction:ltr;text-align:right;color:#D9C79E}.brand small{color:#9FB6C6;font-size:12px}
.sp{flex:1}
.me{display:flex;align-items:center;gap:10px;text-align:left}.me b{display:block;font-size:14px}.me small{color:#9FB6C6;font-size:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 40px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi div{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}.kpi b{font-size:26px;font-weight:900}.kpi span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.lh{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}.lh button{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}.lh button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}.pt:hover{border-color:#C5D4D8}.pt.on{border-color:var(--ind);box-shadow:0 0 0 3px rgba(44,95,110,.15)}
.pt div{flex:1;min-width:0}.pt b{display:block;font-size:14.5px}.pt small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}.tag.in{background:rgba(176,138,69,.15);color:#0E6E80}.tag.out{background:var(--ok-l);color:var(--ok)}.tag.pre{background:rgba(154,123,79,.16);color:#AA854D}.tag.task{background:var(--amber-l);color:var(--amber)}.tag.msg{background:var(--red-l);color:var(--red)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:18px 20px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-family:'Frank Ruhl Libre',Georgia,serif;font-size:26px}.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);margin:0}
.road{display:grid;gap:4px;margin:16px 0 6px;position:relative}
.road div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;z-index:1}
.road i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:var(--card);border:3px solid var(--rule);color:var(--muted);font-size:13px}
.road .d i{background:var(--ind);border-color:var(--ind);color:#fff}.road .n i{border-color:var(--cy);color:var(--ind);box-shadow:0 0 0 6px rgba(176,138,69,.18)}
.road span{font-size:12px;color:var(--muted)}.road .n span{color:var(--ink);font-weight:800}
.road:before{content:"";position:absolute;top:16px;right:8%;left:8%;height:3px;background:var(--rule)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.doc{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative}
.doc .k{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;background:rgba(44,95,110,.12);color:var(--ind)}.doc .k.dc{background:var(--ok-l);color:var(--ok)}.doc .k.path{background:var(--amber-l);color:var(--amber)}
.doc b{display:block;margin:6px 0 2px;font-size:15px}.doc p{margin:0;white-space:pre-line;color:var(--ink2);line-height:1.6}.doc small{color:var(--muted)}
.doc .pr{position:absolute;top:10px;left:10px;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:2px 8px;font-size:12px}
.task{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;background:var(--card);text-align:start}
.task i{width:24px;height:24px;border-radius:7px;border:2px solid var(--rule);display:grid;place-items:center;font-style:normal;color:#fff;font-weight:900;flex:none}.task.on{background:var(--ok-l);border-color:var(--ok)}.task.on i{background:var(--ok);border-color:var(--ok)}.task div{flex:1}.task small{display:block;color:var(--muted)}
.th{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding:4px}
.bub{max-width:86%;border-radius:16px;padding:9px 13px;font-size:14.5px;line-height:1.5}.bub small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.bub.g{align-self:flex-start;background:rgba(44,95,110,.1);border-bottom-right-radius:5px}.bub.h{align-self:flex-end;background:var(--ok-l);border-bottom-left-radius:5px}
textarea,input,select{width:100%;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);color:var(--ink)}textarea{min-height:80px;resize:vertical}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--grad);color:#fff}.btn.gh{background:transparent;border:1.5px solid var(--rule);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fg label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--ink2)}.fg .w2{grid-column:span 2}
.ref{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:8px}.ref b{display:block}.ref small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;z-index:99}
.err{max-width:460px;margin:100px auto;text-align:center}
.mbg{position:fixed;inset:0;background:rgba(7,28,36,.5);display:grid;place-items:center;padding:16px;z-index:50}.modal{background:var(--card);border-radius:20px;width:min(560px,100%);padding:20px;max-height:90vh;overflow:auto}
@media (max-width:900px){.grid{grid-template-columns:1fr}.list{position:static;max-height:none}.two{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.me div{display:none}}
</style>

<body>
<div id="app"><div class="err">טוען…</div></div>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TOKEN = new URLSearchParams(location.search).get('d') || '';
const call = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
const dm = s => s ? +s.slice(8, 10) + '/' + +s.slice(5, 7) : '';
const when = s => s ? dm(s.slice(0, 10)) + ' · ' + s.slice(11, 16) : '';
const ini = n => String(n || '').replace(/^(פרופ׳|ד״ר)\s+/, '').split(' ').map(w => w[0]).join('').slice(0, 2);
function toast(x) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = x; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
const KD = { admit: 'אשפוז', op: 'ניתוח', dc: 'מכתב שחרור', path: 'מעבדה', img: 'הדמיה' };
let D = null, SEL = '', F = 'all';
async function load() { try { D = await call('ops_linkMe', TOKEN); if (!SEL && D.eps.length) SEL = (D.eps.find(e => e.unread) || D.eps.find(e => e.st === 'in') || D.eps[0]).id; draw(); } catch (e) { $('#app').innerHTML = `<div class="err"><h2>הקישור לא נפתח</h2><p>${esc(e.message || e)}</p></div>`; } }
const openTasks = e => e.tasks.filter(t => !t.done);
function draw() {
  const E = D.eps, inn = E.filter(e => e.st === 'in'), tasks = E.reduce((a, e) => a + openTasks(e).length, 0), msgs = E.reduce((a, e) => a + e.unread, 0);
  const L = E.filter(e => F === 'all' || (F === 'in' && e.st !== 'out') || (F === 'task' && openTasks(e).length) || (F === 'msg' && e.unread));
  const e = E.find(x => x.id === SEL);
  $('#app').innerHTML = `<header class="top"><img src="${typeof EMBLEM !== 'undefined' ? EMBLEM : ''}" alt=""><div class="brand"><b>Lumen</b><small>${esc(D.dept)} · הקשר עם הקהילה</small></div><span class="sp"></span><div class="me"><div><b>${esc(D.me.n)}</b><small>${esc(D.me.clinic)} · ${esc(D.me.spec)}</small></div><span class="av">${esc(ini(D.me.n))}</span></div></header>
  <main class="wrap"><div class="kpi"><div><b>${inn.length}</b><span>מאושפזים עכשיו</span></div><div><b>${E.filter(x => x.st === 'out').length}</b><span>שוחררו לאחרונה</span></div><div><b>${tasks}</b><span>משימות המשך פתוחות</span></div><div><b>${msgs}</b><span>הודעות חדשות מהמערך</span></div></div>
  <div class="grid"><aside><div class="lh">${[['all', 'כולם'], ['in', 'באשפוז'], ['task', 'משימות'], ['msg', 'הודעות']].map(([k, l]) => `<button data-f="${k}" class="${F === k ? 'on' : ''}">${l}</button>`).join('')}<button id="bRef" style="margin-inline-start:auto">＋ הפניה למערך</button></div><div class="list">${L.map(x => `<button class="pt ${x.id === SEL ? 'on' : ''}" data-p="${x.id}"><span class="av" style="width:34px;height:34px;font-size:12.5px">${esc(ini(x.n))}</span><div><b>${esc(x.n)}</b><small>${esc(x.cond)}</small></div><span style="display:flex;flex-direction:column;gap:3px;align-items:flex-end"><span class="tag ${x.st}">${x.st === 'in' ? 'באשפוז' : x.st === 'pre' ? 'לפני ניתוח' : 'שוחרר/ה'}</span>${x.unread ? `<span class="tag msg">💬 ${x.unread}</span>` : openTasks(x).length ? `<span class="tag task">${openTasks(x).length} משימות</span>` : ''}</span></button>`).join('') || '<p class="sub">אין כאן מטופלים</p>'}</div>
  ${D.refs.length ? `<div class="card" style="margin-top:12px"><h3>ההפניות שלי למערך</h3>${D.refs.map(r => `<div class="ref"><b>${esc(r.n)} <span class="tag ${r.st === 'acc' ? 'out' : r.st === 'no' ? 'msg' : 'pre'}">${r.st === 'acc' ? 'התקבלה · ברשימת ההמתנה' : r.st === 'no' ? 'לא התקבלה' : 'בבדיקה'}</span></b><small>${esc(r.why)}</small></div>`).join('')}</div>` : ''}</aside>
  <section>${e ? epHtml(e) : '<div class="empty">בחרו מטופל/ת מהרשימה</div>'}</section></div></main>`;
  bind();
}
function epHtml(e) {
  return `<div class="card"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="av" style="width:52px;height:52px;font-size:18px">${esc(ini(e.n))}</span><div style="flex:1"><h2>${esc(e.n)}</h2><p class="sub">${esc(e.age)} · ${esc(e.sex)} · ${esc(e.cond)} · אושפז/ה ${dm(e.admit)}${e.room && e.st === 'in' ? ' · ' + esc(e.room) : ''}</p><p class="sub">מנתח/ת: ${esc(e.sur)}${e.res ? ' · רופא/ה במחלקה: ' + esc(e.res) : ''}</p></div>${e.st === 'in' && e.dc ? `<span class="tag in" style="font-size:13px;padding:6px 12px">שחרור צפוי ${dm(e.dc)}</span>` : ''}</div>
   <div class="road" style="grid-template-columns:repeat(${e.path.length},1fr)">${e.path.map((s, i) => `<div class="${e.st === 'out' || i < e.stage ? 'd' : i === e.stage ? 'n' : ''}"><i>${e.st === 'out' || i < e.stage ? '✓' : i + 1}</i><span>${esc(s)}</span></div>`).join('')}</div></div>
   <div class="two"><div><div class="card"><h3>📄 מסמכים מהמערך</h3>${e.docs.map(d => `<div class="doc"><button class="pr" data-print="${d.id}">הדפסה</button><span class="k ${d.k}">${KD[d.k] || d.k}</span><b>${esc(d.t)}</b><p>${esc(d.x)}</p><small>${when(d.at)}</small></div>`).join('') || '<p class="sub">עוד אין מסמכים</p>'}</div></div>
   <div><div class="card"><h3>✅ משימות המשך</h3>${e.tasks.map(t => `<button class="task ${t.done ? 'on' : ''}" data-t="${t.id}"><i>${t.done ? '✓' : ''}</i><div><b>${esc(t.t)}</b><small>עד ${dm(t.due)} · ${esc(t.by)}</small></div></button>`).join('') || '<p class="sub">אין משימות פתוחות</p>'}</div>
   <div class="card"><h3>💬 שיחה עם המערך</h3><div class="th">${e.notes.map(n => `<div class="bub ${n.from}">${esc(n.x)}<small>${esc(n.by)} · ${when(n.at)}</small></div>`).join('') || '<p class="sub">אפשר לכתוב כאן לצוות המטפל: רקע, תרופות, שאלות.</p>'}</div><textarea id="msg" placeholder="הודעה לצוות המטפל"></textarea><div class="row"><button class="btn" id="bSend">שליחה</button></div></div></div></div>`;
}
function bind() {
  $$('[data-f]').forEach(b => b.onclick = () => { F = b.dataset.f; draw(); });
  $$('[data-p]').forEach(b => b.onclick = () => { SEL = b.dataset.p; draw(); });
  $$('[data-t]').forEach(b => b.onclick = async () => { try { const r = await call('ops_linkTask', TOKEN, SEL, b.dataset.t); D.eps[D.eps.findIndex(x => x.id === SEL)] = r; toast('✓ עודכן אצל המערך'); draw(); } catch (e) { toast(e.message); } });
  if ($('#bSend')) $('#bSend').onclick = async () => { const x = $('#msg').value.trim(); if (!x) return; try { const r = await call('ops_linkGpPost', TOKEN, SEL, x); D.eps[D.eps.findIndex(e => e.id === SEL)] = r; toast('✓ נשלח למערך'); draw(); } catch (e) { toast(e.message); } };
  $$('[data-print]').forEach(b => b.onclick = () => { const e = D.eps.find(x => x.id === SEL), d = e.docs.find(x => x.id === b.dataset.print), w = window.open('', '_blank'); if (!w) return toast('הדפדפן חסם את החלון'); w.document.write(`<html dir="rtl"><body style="font-family:Arial;padding:30px;max-width:700px"><h2>${esc(d.t)}</h2><p>${esc(e.n)} · ${esc(e.cond)}</p><p style="white-space:pre-line;line-height:1.7">${esc(d.x)}</p><p style="color:#777">המערך הכירורגי · המרכז הרפואי אופק · ${when(d.at)}</p></body></html>`); w.document.close(); w.print(); });
  $('#bRef').onclick = () => {
    const bg = document.createElement('div'); bg.className = 'mbg';
    bg.innerHTML = `<div class="modal"><h3 style="margin:0 0 4px;font-size:20px">הפניה למערך הכירורגי</h3><p class="sub" style="margin-bottom:12px">ההפניה מגיעה ישירות לבנק הניתוחים של הצוות המתאים</p><div class="fg"><label class="w2">שם המטופל/ת<input id="rN"></label><label>גיל<input id="rA" type="number"></label><label>מין<select id="rS"><option>ז</option><option>נ</option></select></label><label class="w2">הסיבה להפניה<textarea id="rW" placeholder="ממצאים, בדיקות, מה רציתם שנבדוק"></textarea></label><label>תחום<select id="rT">${D.teams.map(t => `<option value="${t.id}">${esc(t.t)}</option>`).join('')}</select></label><label>דחיפות<select id="rP"><option value="1">דחוף · עד שבועיים</option><option value="2">חודש</option><option value="3" selected>3 חודשים</option><option value="4">חצי שנה</option></select></label></div><div class="row"><button class="btn" id="rGo">שליחת ההפניה</button><button class="btn gh" id="rX">ביטול</button></div></div>`;
    document.body.appendChild(bg); bg.onclick = e => { if (e.target === bg) bg.remove(); }; bg.querySelector('#rX').onclick = () => bg.remove();
    bg.querySelector('#rGo').onclick = async () => { try { D.refs = await call('ops_linkRefer', TOKEN, { n: $('#rN').value, age: $('#rA').value, sex: $('#rS').value, why: $('#rW').value, team: $('#rT').value, pri: $('#rP').value }); bg.remove(); toast('✓ ההפניה נשלחה למערך'); draw(); } catch (e) { toast(e.message); } };
  };
}
load();
</script>
</body>
</html>
