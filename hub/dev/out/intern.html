<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta name="robots" content="noindex,nofollow"><script src="../mock.js?v=1793110123"></script><script src="../qa.js?v=1793110123"></script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onload="window.__chartReady && window.__chartReady()"></script>
<style>
:root{--navy:#0C2A35;--navy2:#13353F;--navy3:#1B4350;--line-d:#2A4852;--bg:#EDF0F6;--surface:#fff;--ink:#0C2A35;--ink2:#3E5960;--muted:#6B7B80;--rule:#D9DFEA;--rule2:#E6EAF2;--green:#187A5C;--green2:#3F6FD8;--green-l:#E4E9F4;--gold:#2C5F6E;--gold2:#B08A45;--gold-l:#DDF3EA;--gold-d:#1C4250;--serif:'Frank Ruhl Libre','David',Georgia,serif;--sans:'Heebo','Assistant','Segoe UI',Arial,sans-serif;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
a{color:inherit}

/* hero */
.hero{background:var(--navy);color:#F2F4F8;position:relative;overflow:hidden;padding:22px 20px 70px}
.hero::before{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;border:1px solid rgba(176,138,69,.25)}
.hero::after{content:"";position:absolute;inset:-140px auto auto -100px;width:340px;height:340px;border-radius:50%;border:1px solid rgba(63,111,216,.25)}
.hero-in{max-width:980px;margin:0 auto;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px}
.ptr-hint{display:none}body.touch .ptr-hint{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid rgba(242,244,248,.25);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;font-weight:700;color:rgba(242,244,248,.75);white-space:nowrap;cursor:pointer}
@media (max-width:420px){body.touch .top .tag{display:none}}
.top img.k{height:40px;border-radius:6px}.top img.c{height:20px}
.top .sep{width:1px;height:28px;background:var(--line-d)}
.top .spacer{flex:1}
.top .tag{font-size:13px;color:#A9B8BC;font-weight:700}
.me{display:flex;align-items:center;gap:22px;margin-top:30px}
.ring{position:relative;width:150px;height:150px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ph{position:absolute;inset:14px;border-radius:50%;overflow:hidden;background:var(--navy3);display:grid;place-items:center;font-family:var(--serif);font-size:44px;font-weight:700}
.ring .ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.ring .pct{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 12px;white-space:nowrap}
.hello small{display:block;color:var(--gold2);font-weight:700;letter-spacing:.5px}
.hello h1{margin:2px 0 6px;font-family:var(--serif);font-size:44px;line-height:1.05}
.hello p{margin:0;color:#C9D4D6;max-width:520px}

.wrap{max-width:980px;margin:-46px auto 0;padding:0 16px 80px;position:relative;z-index:2;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px;box-shadow:0 10px 30px rgba(12,42,53,.06)}
.card h2{margin:0 0 4px;font-family:var(--serif);font-size:24px}
.card .cap{color:var(--muted);font-size:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;box-shadow:0 10px 30px rgba(12,42,53,.06)}
.stat b{display:block;font-family:var(--serif);font-size:32px;line-height:1.05;color:var(--navy)}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.stat.g{background:var(--green);border-color:var(--green)}.stat.g b,.stat.g span{color:#fff}

/* month bar */
.mbar{height:10px;background:var(--rule2);border-radius:999px;overflow:hidden;margin:6px 0 6px}
.mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:999px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.mlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}

/* journey */
.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.jstep{position:relative;text-align:center;padding:4px 4px 0}
.jdot{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;border:2px solid var(--rule);background:var(--surface);color:var(--muted);position:relative;z-index:1}
.jstep.done .jdot{background:var(--green);border-color:var(--green);color:#fff}
.jstep.next .jdot{border-color:var(--gold);color:var(--gold-d);box-shadow:0 0 0 6px var(--gold-l)}
.jline{position:absolute;top:29px;right:12.5%;left:12.5%;height:3px;background:var(--rule2);border-radius:3px}
.jline i{display:block;height:100%;background:var(--green2);border-radius:3px;width:0;transition:width 1s ease}
.jstep b{display:block;font-size:15px}
.jstep span{font-size:12px;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--gold-l);border-radius:12px;padding:14px 16px;margin-top:16px;flex-wrap:wrap}
.cta b{font-size:16px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.gold{background:var(--gold);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.ghost{background:var(--surface);border:1px solid var(--rule);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}

/* skills */
.chartbox{position:relative;height:300px}
.sk{display:grid;grid-template-columns:minmax(0,1fr) 120px 54px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule2);font-size:15px}
.sk:last-child{border-bottom:0}
.sk .bar{height:8px;background:var(--rule2);border-radius:999px;position:relative;overflow:hidden}
.sk .bar i{position:absolute;top:0;bottom:0;right:0;border-radius:999px;background:var(--green2);width:0;transition:width 1s ease}
.sk .bar u{position:absolute;top:0;bottom:0;right:0;border-radius:999px;background:var(--gold2);opacity:.55}
.sk .d{font-weight:800;color:var(--green);text-align:left;direction:ltr}
.sk .d.z{color:var(--muted)}

/* schedule */
.days{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.day{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--ink2)}
.day[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#F2F4F8}
.ev{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:8px;background:var(--rule2)}
.ev .t{font-family:var(--serif);font-weight:700;font-size:20px;min-width:96px;direction:ltr;text-align:right}
.ev.you{background:var(--green);color:#fff}
.ev.you small{color:#DDF0E8}
.ev small{display:block;color:var(--muted);font-size:13px}

/* tips */
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tip{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.tip .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#F2F4F8;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.tip b{display:block}
.tip span{font-size:14px;color:var(--ink2)}

/* contacts */
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.person b{font-family:var(--serif);font-size:20px}
.person span{font-size:14px;color:var(--muted)}
.person .acts{display:flex;gap:8px;margin-top:4px}
.person .acts a{font-size:14px;padding:6px 14px}

/* feedback */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.moods{display:flex;gap:10px;margin:4px 0 14px}
.mood{width:52px;height:52px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);font-size:26px;cursor:pointer;transition:transform .15s}
.mood[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-l);transform:scale(1.12)}
textarea{width:100%;min-height:110px;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;resize:vertical;background:#FBFDFC}
.anon{display:flex;align-items:center;gap:10px;margin:10px 0 14px;font-weight:700;cursor:pointer}
.anon input{width:20px;height:20px;accent-color:var(--green)}
.thanks{text-align:center;padding:26px 10px}
.thanks .big{font-size:54px;line-height:1}
.thanks h3{font-family:var(--serif);font-size:26px;margin:10px 0 4px}

.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;transition:none}.mbar i,.sk .bar i,.jline i,.mood{transition:none}}

.center{min-height:100vh;display:grid;place-items:center;background:var(--navy);color:#F2F4F8;text-align:center;padding:24px}
.center h1{font-family:var(--serif)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line-d);border-top-color:var(--gold2);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (max-width:760px), (max-height:500px) and (max-width:1000px){
.hero{padding:16px 16px 64px}
.top img.c,.top .sep{display:none}
.me{flex-direction:column;align-items:flex-start;gap:16px;margin-top:22px}
.ring{width:128px;height:128px}
.hello h1{font-size:34px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid2,.tips,.people{grid-template-columns:1fr}
.journey .jstep span{display:none}
.jdot{width:44px;height:44px;font-size:17px}
.jline{top:25px}
.sk{grid-template-columns:minmax(0,1fr) 90px 44px}
.card{padding:18px 16px}
}

.msgs .msg{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule2,#E6EAF2)}
.msgs .msg:last-child{border-bottom:0}
.msgs .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#DDF3EA;font-size:19px;flex-shrink:0}
.msgs .msg.p .mi{background:#E4E9F4}
.msgs .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.msgs .mt p{margin:0;white-space:pre-wrap;color:#3E5960}
.msgs .mt small{color:#6B7B80;font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:#E4E9F4;color:#187A5C;align-self:flex-start}
.badge.g{background:#DDF3EA;color:#1C4250}
.lits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lit{border:1px solid #D9DFEA;border-top:4px solid #2C5F6E;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.lit b{font-size:16px;line-height:1.25}
.lit span{font-size:14px;color:#3E5960}
.btn.sm{padding:5px 12px;font-size:13px;align-self:flex-start}
.subh{margin:16px 0 8px;font-size:17px}
.ev.study{border-right-color:#2C5F6E}.ev.clinic{background:#E4E9F4}.ev.event{background:#F6E3DE}
.bookhero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0C2A35,#1B4350);color:#F2F4F8;border-radius:14px;padding:22px 24px;display:flex;align-items:center;gap:20px;box-shadow:0 14px 34px rgba(12,42,53,.18)}
.bookhero:after{content:"";position:absolute;left:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(176,138,69,.35)}
.bk-cover{width:74px;height:96px;border-radius:6px;background:#F2F4F8;flex-shrink:0;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25);border-right:6px solid #2C5F6E}
.bk-cover svg{width:34px;height:34px;color:#0C2A35}
.bk-t{flex:1;min-width:0;position:relative;z-index:1}
.bk-t small{color:#B08A45;font-weight:800;letter-spacing:1px}
.bk-t h2{margin:2px 0 4px;font-family:var(--serif);font-size:26px}
.bk-t p{margin:0;color:#C9D4D6;font-size:15px}
.bookhero .btn{position:relative;z-index:1;flex-shrink:0}
.bookhero.po{margin-top:12px;background:linear-gradient(135deg,#55442A,#93774C)}.bookhero.po .bk-cover{border-right-color:#D9C79E}
@media (max-width:760px), (max-height:500px) and (max-width:1000px){.bookhero{flex-wrap:wrap}.bookhero .btn{width:100%;justify-content:center}}
.duty-mine{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.duty-mine span{background:var(--navy);color:#F2F4F8;border-radius:12px;padding:8px 12px;font-weight:800;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:62px}
.duty-mine span small{font-weight:600;color:#B08A45;font-size:12px}
.duty-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.duty-all div{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid var(--rule2);padding:5px 2px}
.duty-all div.me{font-weight:800;color:var(--green)}
.duty-all details summary{cursor:pointer}
.a2hs{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--rule);border-right:4px solid var(--gold);border-radius:14px;padding:14px 16px}
.a2hs b{display:block}.a2hs p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.a2hs button{margin-right:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.myweek{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.myday{border-radius:12px;padding:10px 6px;text-align:center;background:var(--bg,#EDF0F6);border:1px solid #D9DFEA;display:flex;flex-direction:column;gap:4px}
.myday small{color:#6B7B80;font-size:12px}
.myday b{font-size:14px;line-height:1.25}
.myday.today{outline:2px solid #2C5F6E}
.myday.off b{color:#A3402E}
.wtabs{display:flex;gap:6px;margin-bottom:10px}
.wtabs button{border:1px solid #D9DFEA;background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer}
.wtabs button[aria-pressed="true"]{background:#0C2A35;color:#fff;border-color:#0C2A35}
@media (max-width:420px){.myweek{gap:4px}.myday b{font-size:12px}}
.sems{display:flex;flex-direction:column;gap:10px}
.semc{display:flex;gap:14px;align-items:center;border:1px solid #D9DFEA;border-radius:14px;padding:14px 16px;background:#fff}
.semc .n{width:50px;height:50px;border-radius:50%;background:#0C2A35;color:#F2F4F8;display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0}
.semc .t{flex:1;min-width:0}.semc .t b{display:block;font-size:16px}.semc .t span{font-size:13.5px;color:#3E5960}
.semc .soon{font-size:12px;font-weight:800;color:#1C4250;background:#DDF3EA;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tabbar{position:sticky;top:0;z-index:40;display:flex;justify-content:center;gap:6px;background:rgba(12,42,53,.97);backdrop-filter:blur(8px);padding:10px 12px;border-bottom:1px solid #2A4852}
.tabbar .brand{display:flex;align-items:center;gap:8px;margin-left:auto;color:#F2F4F8;font-weight:800;font-size:14px}
.tabbar .brand img{height:30px;background:#fff;border-radius:6px;padding:2px 5px}
.tabbar .tabs{display:flex;gap:6px}
.tabbar button{border:0;background:none;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:800;color:#A9B8BC;cursor:pointer;font-family:inherit;font-size:15px;transition:background .15s,color .15s}
.tabbar button svg{width:20px;height:20px;flex-shrink:0}
.tabbar button:hover{color:#F2F4F8}
.tabbar button[aria-current="page"]{background:#F2F4F8;color:#0C2A35}
.tabbar button[aria-current="page"] svg{color:#2C5F6E}
.tabbar .badge2{background:#2C5F6E;color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-right:-4px}
body.nohero .hero{display:none}
body.nohero .wrap{margin-top:18px}
.page{display:flex;flex-direction:column;gap:16px}
.page[hidden]{display:none}
.phead{background:linear-gradient(135deg,#0C2A35,#1B4350);color:#F2F4F8;border-radius:18px;padding:22px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 26px rgba(12,42,53,.14)}
.phead .pi{width:52px;height:52px;border-radius:14px;background:#163C48;display:grid;place-items:center;flex-shrink:0}
.phead .pi svg{width:28px;height:28px;color:#B08A45}
.phead h1{margin:0;font-family:var(--serif);font-size:30px;line-height:1.1}
.phead p{margin:2px 0 0;color:#C9D4D6;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:#fff;border:1px solid #D9DFEA;border-radius:16px;padding:16px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:5px;font-family:inherit;color:inherit;box-shadow:0 4px 14px rgba(12,42,53,.05);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(12,42,53,.10)}
.tile i{font-style:normal;font-size:22px}
.tile small{color:#6B7B80;font-weight:800;font-size:12.5px}
.tile b{font-size:18px;color:#0C2A35;line-height:1.25}
.tile span{font-size:13px;color:#3E5960}
.tile.hot{border-color:#2C5F6E;background:#F6FAF8}
@media (max-width:760px), (max-height:500px) and (max-width:1000px){
.tabbar{position:fixed;top:auto;bottom:0;left:0;right:0;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));gap:0;border:0;border-top:1px solid #2A4852;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.tabbar .brand{display:none}
.tabbar .tabs{flex:1;justify-content:space-around;gap:0}
.tabbar button{flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;flex:1;border-radius:12px}
.tabbar button[aria-current="page"]{background:#163C48;color:#F2F4F8}
.tabbar button[aria-current="page"] svg{color:#B08A45}
body{padding-bottom:86px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.phead{padding:18px}.phead h1{font-size:25px}
}
.tt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;font-size:13px}
.tt th{font-size:12px;color:#56676C;font-weight:800;padding:4px 2px;text-align:center}
.tt th small{display:block;font-weight:600;color:#8A979B}
.tt td.n{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:96px;text-align:right}
.tt tr.mine td.n{color:#187A5C}
.tt .c{border-radius:9px;padding:7px 3px;text-align:center;font-weight:800;color:#fff;font-size:12px;line-height:1.2;min-height:32px;display:flex;align-items:center;justify-content:center}
.tt .c.x{background:#F6E3DE;color:#A3402E}.tt .c.e{background:#E6EAF2;color:#8A979B;font-weight:600}
.tt tr.mine .c{box-shadow:inset 0 0 0 2px #2C5F6E}
.ttwrap{overflow-x:auto}

    const bg = document.createElement('div'); bg.className = 'crp-bg';
    bg.innerHTML = `<div class="crp-box" role="dialog" aria-modal="true"><b class="crp-t">מרכזו את הפנים בעיגול</b><span class="crp-s">גוררים כדי להזיז · מגדילים עם המחוון או בצביטה</span>
      <div class="crp-st"><img alt=""><i class="crp-ring"></i></div>
      <label class="crp-z"><span>➖</span><input type="range" min="1" max="4" step="0.01" value="1" aria-label="הגדלה"><span>➕</span></label>
      <div class="crp-a"><button class="crp-ok" type="button">✓ שמירה</button><button class="crp-x" type="button">ביטול</button></div></div>`;
    document.body.appendChild(bg);
    const st = bg.querySelector('.crp-st'), img = bg.querySelector('img'), zr = bg.querySelector('input');
    let base = 1, z = 1, x = 0, y = 0, done = false;
    const L = () => st.clientWidth;
    const clamp = () => { const s = base * z, w = img.naturalWidth * s, h = img.naturalHeight * s, n = L(); x = Math.min(0, Math.max(n - w, x)); y = Math.min(0, Math.max(n - h, y)); };
    const draw = () => { clamp(); img.style.transform = `translate(${x}px,${y}px) scale(${base * z})`; };
    const zoomTo = (nz, cx, cy) => { const n = L(); if (cx == null) { cx = n / 2; cy = n / 2; } const s0 = base * z; nz = Math.max(1, Math.min(4, nz)); const s1 = base * nz; x = cx - (cx - x) * s1 / s0; y = cy - (cy - y) * s1 / s0; z = nz; zr.value = z; draw(); };
    const close = v => { if (done) return; done = true; bg.remove(); resolve(v); };
    img.onload = () => { const n = L(); base = Math.max(n / img.naturalWidth, n / img.naturalHeight); z = 1; x = (n - img.naturalWidth * base) / 2; y = (n - img.naturalHeight * base) / 2; draw(); };
    img.onerror = () => close(null);
    img.src = src;
    const pts = new Map(); let last = null, pinch = null;
    st.addEventListener('pointerdown', e => { try { st.setPointerCapture(e.pointerId); } catch (er) {} pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const v = [...pts.values()]; pinch = { d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1, z: z }; last = null; } else last = { x: e.clientX, y: e.clientY }; });
    st.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2 && pinch) { const v = [...pts.values()], r = st.getBoundingClientRect(); zoomTo(pinch.z * Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) / pinch.d, (v[0].x + v[1].x) / 2 - r.left, (v[0].y + v[1].y) / 2 - r.top); return; }
      if (last) { x += e.clientX - last.x; y += e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; draw(); } });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; last = pts.size === 1 ? Object.assign({}, [...pts.values()][0]) : null; };
    st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
    st.addEventListener('wheel', e => { e.preventDefault(); const r = st.getBoundingClientRect(); zoomTo(z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    zr.oninput = () => zoomTo(Number(zr.value));
    bg.querySelector('.crp-x').onclick = () => close(null);
    bg.querySelector('.crp-ok').onclick = () => {
      const n = L(), s = base * z, sx = -x / s, sy = -y / s, sw = n / s;
      let px = 480, q = .86, out = '';
      for (let k = 0; k < 9; k++) { const c = document.createElement('canvas'); c.width = c.height = px; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, px, px); g.drawImage(img, sx, sy, sw, sw, 0, 0, px, px); out = c.toDataURL('image/jpeg', q); if (out.length < 46000) break; px = Math.round(px * .88); q = Math.max(.55, q - .05); }
      close(out);
    };
  });
}
async function uploadMyPhoto(file, src){
  if (!file && !src) return;
  let url = '';
  try { url = await cropPhoto(src || await readImg(file)); } catch (e) { url = ''; }
  if (!url) return;
  rqToast('מעלה את התמונה…');
  const pg = document.querySelector('.pg-go'); if (pg && pg.firstChild) pg.firstChild.textContent = 'מעלה את התמונה…';
  try {
    const ph = await call('wa_internPhoto', TOKEN, url);
    D.photo = ph || url;
    document.querySelectorAll('.ring .ph').forEach(e => e.innerHTML = `<img src="${D.photo}" alt="">`);
    document.querySelectorAll('.ring').forEach(r => { if (!r.querySelector('.phcrop')) r.insertAdjacentHTML('beforeend', '<button class="phcrop" type="button" aria-label="מיקום התמונה" title="מיקום התמונה">✂️</button>'); });
    document.querySelectorAll('.phbtn').forEach(e => { e.title = 'החלפת תמונה'; e.setAttribute('aria-label', 'החלפת תמונה'); });
    try { homeV2(); } catch (e) {}
    try { photoGate(); } catch (e) {}
    rqToast('התמונה עודכנה ✓');
  } catch (e) { rqToast('ההעלאה לא הצליחה. נסו תמונה אחרת'); if (pg && pg.firstChild) pg.firstChild.textContent = 'להעלאת תמונה'; }
}
document.addEventListener('click', e => { const b = e.target && e.target.closest && e.target.closest('.phcrop'); if (b && D && D.photo) uploadMyPhoto(null, D.photo); });
document.addEventListener('change', e => { if (e.target && e.target.classList && e.target.classList.contains('phin')) { uploadMyPhoto(e.target.files && e.target.files[0]); e.target.value = ''; } });

// skipping the photo lasts until tomorrow: the camera window comes back once a day until a photo is uploaded
const phDay = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
let PH_SKIP = (() => { try { return localStorage.getItem('ph_skip_day') === phDay(); } catch (e) { return false; } })();
const phSkips = () => { try { return Number(localStorage.getItem('ph_skips') || 0); } catch (e) { return 0; } };
function photoGate(){
  let g = document.getElementById('phgate');
  if (D.photo || PH_SKIP) { if (g) g.remove(); document.body.classList.remove('gated'); return; }
  if (!g) { g = document.createElement('div'); g.id = 'phgate'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true'); document.body.appendChild(g); }
  document.body.classList.add('gated');
  g.innerHTML = `<div class="pg-box"><div class="pg-ic">📷</div><small>עוד צעד אחד</small><h2>תמונת פרופיל</h2><p>כדי שהצוות במחלקה יכיר אותך מהיום הראשון, מעלים תמונת פנים ברורה. סלפי מספיק וזה לוקח 10 שניות.</p>
    <label class="pg-go">להעלאת תמונה<input type="file" class="phin" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden></label><span class="pg-note">אחרי ההעלאה האפליקציה נפתחת. אפשר להחליף את התמונה בכל זמן.</span>
    ${phSkips() ? `<span class="pg-nag">${phSkips() > 2 ? '🙂 עדיין מחכים לתמונה שלך. בלעדיה הצוות לא יודע מי את/ה.' : '🙂 דילגת בפעם הקודמת. אולי עכשיו?'}</span>` : ''}
    <button class="pg-skip" type="button">לא עכשיו (נזכיר מחר)</button></div>`;
  g.querySelector('.pg-skip').onclick = () => {
    PH_SKIP = true; try { localStorage.setItem('ph_skip_day', phDay()); localStorage.setItem('ph_skips', String(phSkips() + 1)); } catch (e) {}
    g.remove(); document.body.classList.remove('gated');
    const c = document.getElementById('phcard'); if (c) c.classList.add('nag');
    rqToast('אפשר להעלות תמונה בכל רגע מעמוד הבית 📷');
  };
}
function ihPhotoCard(page){

  if (!c) { c = document.createElement('section'); c.id = 'phcard'; c.className = 'card phcard' + (PH_SKIP || phSkips() ? ' nag' : ''); page.appendChild(c); }
  const crew = D.crew || [], withPh = crew.filter(x => !x.me && x.photo).length, others = crew.filter(x => !x.me).length;

}

/* selective interns: one simple box to write to the team instead of the requests card and the daily summary */

function arrangeHome(page){
  const pick = s => page.querySelector(s);
  const msgs = [...page.children].find(e => e.classList && e.classList.contains('msgs'));
  const order = ['#precard', '#intakecard', '#phcard', '#dtop', '#imon', '#tips', '#pfcard', '#rqcard', '#selmsg', '#ihg', '#rqmini', msgs, '#ipulse', '#a2hs', '#dcard'];
  let ref = null;
  order.forEach(s => { const el = typeof s === 'string' ? pick(s) : s; if (!el || el.parentElement !== page) return; if (!ref) page.prepend(el); else ref.after(el); ref = el; });
}

// design v3: faint Leonardo da Vinci anatomy in the dark panels and behind the page, as in the department portal.
// The drawings are white ink on transparent, served by the site; a missing one just disappears
const ARTB3 = (location.pathname.indexOf('/dev/out/') >= 0 ? new URL('../../../', location.href).href : location.origin + '/') + 'ops/art/';
const V3ART = [['.cc', 'organs'], ['.side', 'vessels'], ['.login', 'organs'], ['.hero', 'organs'], ['.imon', 'organs']];
function v3Art() {
  V3ART.forEach(([q, k]) => document.querySelectorAll(q).forEach(el => { if ([...el.children].some(c => c.classList && c.classList.contains('v3a'))) return;
    const i = document.createElement('img'); i.className = k === 'organs' ? 'v3a v3c' : 'v3a'; i.alt = ''; i.loading = 'lazy'; i.referrerPolicy = 'no-referrer'; i.onerror = () => i.remove(); i.src = ARTB3 + k + '.webp'; el.appendChild(i); }));
  if (!document.querySelector('.v3bg')) { const d = document.createElement('div'); d.className = 'v3bg'; const i = document.createElement('img'); i.alt = ''; i.className = 'v3c'; i.referrerPolicy = 'no-referrer'; i.onerror = () => d.remove(); i.src = ARTB3 + 'organs.webp'; d.appendChild(i); document.body.prepend(d); }

try { new MutationObserver(() => { clearTimeout(v3Art.t); v3Art.t = setTimeout(v3Art, 80); }).observe(document.body, { childList: true, subtree: true }); v3Art(); } catch (e) {}

// "what's new in surgery", the same strip as in the department portal: the latest papers from the surgical journals (PubMed),
// innovation and FDA devices. The department portal refreshes them every few hours and copies them here; a box with class nwsBox shows them
const NW = { tab: 'res', busy: 0, tried: 0, data: null }, NW_ART = (location.pathname.indexOf('/dev/out/') >= 0 ? new URL('../../../', location.href).href : location.origin + '/') + 'ops/art/tools.webp';
const NJ_COL = { 'Ann Surg': '#1D4E7E', 'JAMA Surg': '#A3402E', 'Br J Surg': '#00796A', 'J Am Coll Surg': '#408C9C', 'Surg Endosc': '#B5862E', 'N Engl J Med': '#B0242A', 'Lancet': '#6A5330', 'Surgery': '#2F6FA8', 'Ann Surg Oncol': '#5FACBD', 'Dis Colon Rectum': '#187A5C', 'Obes Surg': '#C9893F', 'HPB (Oxford)': '#4A86C5', 'World J Surg': '#3D5562', 'J Trauma Acute Care Surg': '#C9503A', 'Surg Obes Relat Dis': '#8E5F1E', 'Hernia': '#1C4250' };
const DEV_IC = t => /mesh|hernia/i.test(t) ? '🕸' : /stapl|staple/i.test(t) ? '📎' : /suture/i.test(t) ? '🧵' : /electro|ultrason|harmonic|seal|coag/i.test(t) ? '⚡' : /wound|negative pressure/i.test(t) ? '🩹' : /robot/i.test(t) ? '🤖' : /endoscop|laparoscop|camera/i.test(t) ? '🔭' : /clip|ligat/i.test(t) ? '🔗' : '🛠';
const nwAgo = iso => { const d = Math.round((Date.now() - new Date(iso).getTime()) / 864e5); return d <= 0 ? 'היום' : d === 1 ? 'אתמול' : d < 30 ? `לפני ${d} ימים` : new Date(iso).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' }); };
const nwDate = s => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' }); };
function newsHtml(N) {
  if (N && N.all) { const keys = N.def || [], ta = new Set(N.all.filter(x => keys.indexOf(x.k) >= 0).map(x => x.ta)), f = L => { const r = (L || []).filter(x => ta.has(x.j)); return r.length ? r : L || []; };
    N = Object.assign({}, N, { res: f(N.res).slice(0, 18), inn: f(N.inn).slice(0, 10), j: N.all.filter(x => keys.indexOf(x.k) >= 0).map(x => x.name) }); }
  if (!N || !((N.res || []).length || (N.dev || []).length)) return NW.busy ? `<section class="nws"><div class="nwh"><div class="nwt"><small>מה חדש בעולם הכירורגיה</small><b>מחקר · חדשנות · מכשירים</b></div></div><p class="nwz">טוען את המאמרים האחרונים…</p></section>` : '';
  const T = { res: ['📚 מחקר', N.res || []], inn: ['🤖 חדשנות', N.inn || []], dev: ['🛠 מכשירים', N.dev || []] }, L = T[NW.tab][1];
  const paper = x => `<a class="nwc" href="${esc(x.u)}" target="_blank" rel="noopener" style="--jc:${NJ_COL[x.j] || '#0C2A35'}"><span class="nwj">${esc(x.j)}</span><b dir="ltr">${esc(x.t)}</b><span class="nwm" dir="ltr">${esc(x.au || '')}${x.n > 1 ? ' et al.' : ''}</span><span class="nwf"><i>${nwDate(x.d)}</i><em>PubMed ↗</em></span></a>`;
  const dev = x => `<a class="nwc dv" href="${esc(x.u)}" target="_blank" rel="noopener"><span class="nwj"><i>${DEV_IC(x.t + ' ' + x.kind)}</i>${esc(x.kind || 'FDA 510(k)')}</span><b dir="ltr">${esc(x.t)}</b><span class="nwm" dir="ltr">${esc(x.co || '')}</span><span class="nwf"><i>${nwDate(x.d)} · ${esc(x.k || '')}</i><em>FDA ↗</em></span></a>`;
  return `<section class="nws"><img class="nwa" src="${NW_ART}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><div class="nwh"><div class="nwt"><small>מה חדש בעולם הכירורגיה</small><b>${(N.j || []).slice(0, 6).join(' · ')}</b></div><div class="nwtabs">${Object.keys(T).map(k => `<button type="button" data-nwt="${k}" class="${NW.tab === k ? 'on' : ''}">${T[k][0]}<u>${T[k][1].length}</u></button>`).join('')}</div><span class="nwu">עודכן ${nwAgo(N.at)}</span></div><div class="nwr">${L.map(NW.tab === 'dev' ? dev : paper).join('') || '<p class="nwz">אין פריטים כרגע</p>'}</div><p class="nws-src">${NW.tab === 'dev' ? 'אישורי 510(k) אחרונים של ה-FDA לכירורגיה כללית (openFDA)' : 'המאמרים האחרונים מ-PubMed · לחיצה פותחת את המאמר'}</p></section>`;
}
function newsMount(key) {
  if (typeof NW === 'undefined') return;
  const draw = () => document.querySelectorAll('.nwsBox').forEach(b => { b.innerHTML = newsHtml(NW.data); b.querySelectorAll('[data-nwt]').forEach(x => x.onclick = () => { NW.tab = x.dataset.nwt; draw(); }); });
  key = key || (window.__MOCK ? 'mock' : ''); draw(); if (NW.data || NW.tried || !key) return;
  NW.tried = 1; NW.busy = 1; draw(); call('wa_news', key).then(r => { if (r && r.at) NW.data = r; }).catch(() => {}).then(() => { NW.busy = 0; draw(); });
}
